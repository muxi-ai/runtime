[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "muxi"
version = "0.0.1"
authors = [
  {name = "Ran Aroussi", email = "ran@aroussi.com"},
]
description = "A powerful, extensible framework for building AI agents"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    # Core dependencies
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
    "anyio>=3.7.0",
    "python-dotenv>=1.0.0",
    "websockets>=11.0.3",
    "httpx-sse>=0.4.0",
    "rich>=13.6.0",
    "colorama>=0.4.6",
    "psutil>=5.9.0",  # System and process utilities

    # MCP Package
    "mcp>=1.12.3",  # Required for Streamable HTTP transport support

    # File processing and utilities
    "aiofiles>=23.2.0",
    "python-magic>=0.4.27",

    # Document processing dependencies
    "markitdown[all]>=0.1.0",  # Convert various file formats to Markdown
    "pypdf2>=3.0.0",  # PDF document processing
    "python-docx>=1.1.0",  # Word document processing
    "markdownify>=0.11.6",  # HTML to Markdown conversion
    "nltk>=3.8.0",  # Natural language processing for chunking
    "spacy>=3.8.0",  # Advanced NLP for semantic chunking (compatible with NumPy 2.x)
    "sentence-transformers>=2.2.0",  # Embedding generation for semantic search

    # Image processing dependencies
    "Pillow>=10.0.0",  # PIL/Pillow for image processing
    "pdf2image>=1.16.0",  # Convert PDF pages to images (requires Poppler)

    # LLM Package
    "onellm>=0.1.0",

    # A2A (Agent-to-Agent) Communication
    "a2a-sdk>=0.3",  # Google's Agent-to-Agent SDK for inter-agent communication

    # Development tools
    "pytest>=7.0.0",

    # Server components
    "fastapi>=0.108.0",
    "uvicorn>=0.24.0",
    "starlette>=0.27.0",

    # Vector search
    "faiss-cpu>=1.10.0",
    "faissx>=0.0.3",  # Distributed FAISS for remote vector operations
    "pgvector>=0.3.6",
    "numpy>=1.24.0",
    "sqlite-vec>=0.1.6",  # SQLite vector extension for similarity search

    # Database
    "psycopg2-binary>=2.9.9",
    "SQLAlchemy[asyncio]>=2.0.17",

    # Legacy dependencies (keeping for compatibility)
    "aiohttp>=3.8.0",
    "asyncio>=3.4.3",
    "click>=8.1.0",
    "openai>=1.3.0",

    # File generation dependencies (now core requirements)
    # Data processing and analysis
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "statsmodels>=0.14.0",

    # Visualization
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.15.0",
    "bokeh>=3.1.0",
    "altair>=5.0.0",

    # Document generation
    "reportlab>=4.0.0",
    "fpdf2>=2.7.0",

    # Spreadsheet handling
    "openpyxl>=3.1.0",
    "xlsxwriter>=3.1.0",
    "xlrd>=2.0.0",
    "xlwt>=1.3.0",

    # Image processing (Pillow already included above)
    "qrcode>=7.4.0",
    "python-barcode>=0.15.0",

    # Presentation
    "python-pptx>=0.6.21",

    # File formats
    "lxml>=4.9.0",
]

[project.optional-dependencies]
# All file generation dependencies have been moved to core requirements

[project.urls]
"Homepage" = "https://github.com/muxi-ai/runtime"
"Bug Tracker" = "https://github.com/muxi-ai/runtime/issues"

[project.scripts]
muxi = "muxi.cli:main"

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_optional = true
