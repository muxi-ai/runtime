[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "muxi"
version = "0.0.1"
authors = [
  {name = "Ran Aroussi", email = "ran@aroussi.com"},
]
description = "A powerful, extensible framework for building AI agents"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    # Core dependencies
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
    "anyio>=3.7.0",
    "python-dotenv>=1.0.0",
    "websockets>=11.0.3",
    "httpx-sse>=0.4.0",
    "rich>=13.6.0",
    "colorama>=0.4.6",

    # MCP Package
    "mcp>=1.9.0",  # Required for Streamable HTTP transport support

    # File processing and utilities
    "aiofiles>=23.2.0",
    "python-magic>=0.4.27",

        # Document processing dependencies
    "markitdown[all]>=0.1.0",  # Convert various file formats to Markdown
    "pypdf2>=3.0.0",  # PDF document processing
    "python-docx>=1.1.0",  # Word document processing
    "markdownify>=0.11.6",  # HTML to Markdown conversion
    "nltk>=3.8.0",  # Natural language processing for chunking
    "spacy>=3.8.0",  # Advanced NLP for semantic chunking (compatible with NumPy 2.x)
    "sentence-transformers>=2.2.0",  # Embedding generation for semantic search

    # LLM Package
    "onellm>=0.0.7",

    # A2A (Agent-to-Agent) Communication
    "a2a-sdk>=0.2.8",  # Google's Agent-to-Agent SDK for inter-agent communication

    # Development tools
    "pytest>=7.0.0",

    # Server components
    "fastapi>=0.108.0",
    "uvicorn>=0.24.0",
    "starlette>=0.27.0",

    # Vector search
    "faiss-cpu>=1.10.0",
    "faissx>=0.1.0",  # Distributed FAISS for remote vector operations
    "pgvector>=0.3.6",
    "numpy>=1.24.0",
    "sqlite-vec>=0.1.7",  # SQLite vector extension for similarity search

    # Database
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.0",

    # Legacy dependencies (keeping for compatibility)
    "aiohttp>=3.8.0",
    "asyncio>=3.4.3",
    "click>=8.1.0",
    "openai>=1.3.0",
]

[project.urls]
"Homepage" = "https://github.com/muxi-ai/runtime"
"Bug Tracker" = "https://github.com/muxi-ai/runtime/issues"

[project.scripts]
muxi = "muxi.cli:main"

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
