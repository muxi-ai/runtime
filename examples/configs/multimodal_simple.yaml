---
schema: "1.0.0"
id: "multimodal_simple"
version: "1.0.0"
description: "Simple multi-modal assistant for testing"

# Multi-modal LLM configuration
llm:
  settings:
    temperature: 0.7
    max_tokens: 1000
    timeout_seconds: 30

  api_keys:
    openai: "test-key"
    anthropic: "test-key"

  models:
    - text: "openai/gpt-4o"
      settings:
        temperature: 0.7
        max_tokens: 1000
        timeout_seconds: 30
    - vision: "openai/gpt-4o"
      settings:
        temperature: 0.7
        max_tokens: 1500
        image:
          max_size_mb: 5
          preprocessing:
            resize: true
            max_width: 1024
            max_height: 1024
    - audio: "openai/whisper-1"
      settings:
        max_size_mb: 10
        language: "auto"
    - documents: "openai/gpt-4o"
      settings:
        max_size_mb: 20
        extraction:
          chunk_size: 1000
          overlap: 100
    - embedding: "openai/text-embedding-3-large"
      settings:
        temperature: 0.7
        max_tokens: 1000
        timeout_seconds: 30

# Agents configuration
agents:
  - schema: "1.0.0"
    id: "multimodal_expert"
    name: "Multi-Modal Expert Agent"
    description: "Expert agent with access to all multi-modal capabilities"
    llm_models:
      - text: "openai/gpt-4o"
        settings:
          temperature: 0.8
