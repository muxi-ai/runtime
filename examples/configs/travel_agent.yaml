---
schema: "1.0.0"
id: travel_assistant
version: "1.0.0"
description: "Specialized in providing travel advice, destination recommendations, itinerary planning, and information about tourist attractions worldwide."

# Multi-modal LLM configuration
llm:
  settings:
    temperature: 0.7
    max_tokens: 1000
    timeout_seconds: 30

  api_keys:
    openai: "${OPENAI_API_KEY}"

  models:
    - text: "openai/gpt-4o"
      settings:
        temperature: 0.7
        max_tokens: 1000
        timeout_seconds: 30
    - vision: "openai/gpt-4o"
      settings:
        temperature: 0.7
        max_tokens: 1500
        image:
          max_size_mb: 5
          preprocessing:
            resize: true
            max_width: 1024
            max_height: 1024

# Agents configuration
agents:
  - schema: "1.0.0"
    id: "travel_expert"
    name: "Travel Expert Agent"
    description: "Travel and tourism specialist"
    system_message: "You are a helpful assistant specialized in travel and tourism. You can provide recommendations on destinations, attractions, and travel planning. You can also analyze travel photos and documents."
    llm_models:
      - text: "openai/gpt-4o"
        settings:
          temperature: 0.7

# MCP servers configuration
mcp:
  servers:
    - schema: "1.0.0"
      id: travel_api
      description: "Travel API service for destinations and booking information"
      type: "http"
      endpoint: http://localhost:5003
      auth:
        type: "api_key"
        key: "${TRAVEL_API_KEY}"
    - schema: "1.0.0"
      id: web_search
      description: "Web search service for travel information lookup"
      type: "http"
      endpoint: http://localhost:5002
      auth:
        type: "api_key"
        key: "${SEARCH_API_KEY}"

# Memory configuration
memory:
  buffer:
    size: 10
    multiplier: 10
    vector_search: true
    vector_dimension: 1536
    mode: "local"

  long_term:
    connection_string: "sqlite:///travel_memory.db"
    embedding_model: "text-embedding-ada-002"
