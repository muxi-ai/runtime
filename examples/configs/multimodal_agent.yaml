---
schema: "1.0.0"
id: "multimodal_assistant"
description: "Advanced assistant with multi-modal capabilities including vision, audio, and document processing"
system_message: "You are an advanced assistant with multi-modal capabilities. You can process text, images, audio, and documents to provide comprehensive responses."
author: "MUXI Runtime Team"
version: "1.0.0"

# Authentication configuration
auth:
  api_keys:
    admin_key: "${{ secrets.FORMATION_ADMIN_API_KEY }}"
    user_key: "${{ secrets.FORMATION_USER_API_KEY }}"

# Multi-modal LLM configuration
llm:
  settings:
    temperature: 0.7
    max_tokens: 1000
    timeout_seconds: 30

  api_keys:
    openai: "${{ secrets.OPENAI_API_KEY }}"
    anthropic: "${{ secrets.ANTHROPIC_API_KEY }}"

  models:
    - text: "openai/gpt-4o"
      settings:
        temperature: 0.7
        max_tokens: 1000
        timeout_seconds: 30
    - vision: "openai/gpt-4o"
      settings:
        temperature: 0.7
        max_tokens: 1500
        image:
          max_size_mb: 5
          preprocessing:
            resize: true
            max_width: 1024
            max_height: 1024
    - audio: "openai/whisper-1"
      settings:
        max_size_mb: 10
        language: "auto"
    - documents: "openai/gpt-4o"
      settings:
        max_size_mb: 20
        extraction:
          chunk_size: 1000
          overlap: 100
    - embedding: "openai/text-embedding-3-large"
      settings:
        temperature: 0.7
        max_tokens: 1000
        timeout_seconds: 30

# Agents configuration
agents:
  - schema: "1.0.0"
    id: "multimodal_expert"
    name: "Multi-Modal Expert Agent"
    description: "Expert agent with access to all multi-modal capabilities"
    system_message: "You are a multi-modal expert. Analyze images, transcribe audio, process documents, and generate text responses as needed."
    llm_models:
      - text: "openai/gpt-4o"
        settings:
          temperature: 0.8

# MCP servers for enhanced capabilities
mcp:
  servers:
    - schema: "1.0.0"
      id: "vision_processor"
      description: "Vision processing service for image analysis and recognition"
      type: "http"
      endpoint: "http://localhost:5001"
      auth:
        type: "api_key"
        key: "${{ secrets.VISION_API_KEY }}"
    - schema: "1.0.0"
      id: "audio_processor"
      description: "Audio processing service for transcription and analysis"
      type: "http"
      endpoint: "http://localhost:5002"
      auth:
        type: "api_key"
        key: "${{ secrets.AUDIO_API_KEY }}"
    - schema: "1.0.0"
      id: "document_processor"
      description: "Document processing service for text extraction and analysis"
      type: "http"
      endpoint: "http://localhost:5003"
      auth:
        type: "api_key"
        key: "${{ secrets.DOCUMENT_API_KEY }}"

# Memory configuration
memory:
  buffer:
    size: 10
    multiplier: 10
    vector_search: true
    vector_dimension: 1536
    mode: "local"

  long_term:
    connection_string: "postgres://user:password@localhost:5432/multimodal_db"
    embedding_model: "text-embedding-ada-002"

# Overlord configuration with intelligent routing
overlord:
  config:
    max_extraction_tokens: 500
    max_tool_calls: -1
    response_format: "markdown"

  routing:
    model: "llama_cpp/phi-3-mini-4k-instruct"
    settings:
      temperature: 0.2
      max_tokens: 2000
      timeout_seconds: 45
