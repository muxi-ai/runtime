schema: "1.0.0"
id: "multi-agent-test"
description: "Multiple agents for testing routing and collaboration"

llm:
  api_keys:
    openai: "${{ secrets.OPENAI_API_KEY }}"
    anthropic: "${{ secrets.ANTHROPIC_API_KEY }}"
    google: "${{ secrets.GEMINI_API_KEY }}"
  models:
    - text: "openai/gpt-4o-mini"
    - vision: "google/gemini-2.0-flash"
    - video: "google/gemini-2.0-flash"
    - audio: "openai/whisper-1"
    - documents: "openai/gpt-4o"
      settings:
        max_size_mb: 20
        extraction:
          chunk_size: 1000
          overlap: 100
          strategy: "adaptive"
    - embedding: "openai/text-embedding-3-small"


# Overlord behavior configuration
agents:
  - coder
  - project-manager
  - researcher
  - writer

overlord:
  soul: |
    You are Fynn, a friendly, helpful, and professional assistant.

  # Routing model configuration
  llm:  # Overlord-specific routing functionality
    model: "openai/gpt-4o-mini" # Model for task management and delegation
    max_extraction_tokens: 500 # Max tokens for media extractions when needed for routing

  caching:
    enabled: true  # Whether to cache routing decisions (default: True)
    ttl: 3600  # Time to live for cached routing decisions

  # Response configuration
  response:
    format: "markdown" # Default format if not specified (options are markdown, json, text, etc)
    widgets: true # Enable interactive UI elements like buttons, forms, charts (default: true)

  # Workflow configuration (Task decomposition and orchestration)
  workflow:
    auto_decomposition: true # Enable automatic task decomposition (default: true)
    plan_approval_threshold: 10 # Set high to avoid approval prompts during tests
    complexity_threshold: 6.0 # Lower threshold to trigger workflows more easily
    routing_strategy: "capability_based"
    parallel_execution: true
    max_parallel_tasks: 5

  # Clarification configuration (always enabled for better UX)
  clarification:
    max_questions: 5                 # Safety limit - maximum clarifying questions per request
    style: "conversational"          # Question style: conversational, formal, brief
    persist_learned_info: false      # Privacy control: false = session-only, true = persistent learning


memory:
  buffer:
    size: 50
    multiplier: 10
    vector_search: false

logging:
  system:
    level: "debug"
    destination: "stdout"
  conversation:
    enabled: true
    streams:
      - transport: "stdout"
        level: "info"
        format: "jsonl"

mcp:
  servers:
    - linear-mcp
    - notion-mcp
    - web-scraper-mcp
    - web-search-mcp
  enhance_user_prompts: true  # Enable message enhancement for better tool selection
  max_tool_calls: 50
  max_tool_iterations: 10

