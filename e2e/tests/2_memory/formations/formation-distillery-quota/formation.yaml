schema: "1.0.0"
id: distillery-quota-test
description: "Formation for testing durable distillery daily quotas across restarts"
auto_extract_user_info: true

runtime:
  built_in_mcps: false

overlord:
  clarification:
    enabled: false

llm:
  settings:
    temperature: 0.2
    max_tokens: 1000
  api_keys:
    openai: "${{ secrets.OPENAI_API_KEY }}"
  models:
    - text: "openai/gpt-4o-mini"
    - embedding: "openai/text-embedding-3-small"

memory:
  buffer:
    size: 50
    multiplier: 10
    vector_search: false

  persistent:
    provider: "sqlite"
    connection_string: "distillery_quota_test.db"
    embedding_model: "openai/text-embedding-3-small"

  long_term:
    collections: ["conversations", "preferences", "context"]

  # Memory distillery (Phase 3b) with durable daily quotas: the
  # per-distillery daily limit is set at registration time (scope
  # max_events_per_day); counters live in distillery_quota_counters
  # and must survive a formation restart.
  distillery:
    enabled: true
    default_trust_level: verified
    signature_max_age_seconds: 300

agents:
  - id: assistant
    name: "Distillery Quota Test Assistant"
    description: "A helpful assistant for the distillery quota durability test"
    system_message: "You are a helpful assistant. Be concise and direct."

server:
  enabled: true
  port: 8276
  api_keys:
    admin_key: test-admin-key-2w2
    client_key: test-client-key-2w2

logging:
  system:
    level: "error"
    destination: "stdout"
