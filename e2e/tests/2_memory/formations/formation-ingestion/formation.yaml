schema: "1.0.0"
id: ingestion-memory-test
description: "Formation for testing the memory ingestion endpoint and pipeline (Memory Ingestion Phase 3a)"
auto_extract_user_info: true

runtime:
  built_in_mcps: false

overlord:
  clarification:
    enabled: false

llm:
  settings:
    temperature: 0.2
    max_tokens: 1000
  api_keys:
    openai: "${{ secrets.OPENAI_API_KEY }}"
  models:
    - text: "openai/gpt-4o-mini"
    - embedding: "openai/text-embedding-3-small"

memory:
  buffer:
    size: 50
    multiplier: 10
    vector_search: false

  persistent:
    provider: "sqlite"
    connection_string: "ingestion_test.db"
    embedding_model: "openai/text-embedding-3-small"

  # Memory ingestion (Phase 3a): the per-source noise-gate surface.
  # "notes" is the trusted personal-notes source (lenient: only
  # promotional noise dropped); unconfigured sources such as
  # "monitoring" default to the aggressive strict gate.
  ingestion:
    sources:
      notes:
        filter: lenient

agents:
  - id: assistant
    name: "Ingestion Test Assistant"
    description: "A helpful assistant for testing ingested memory recall"
    system_message: "You are a helpful assistant. Be concise and direct. Answer from the provided context when possible."

server:
  enabled: true
  port: 8273
  api_keys:
    admin_key: test-admin-key-2v1
    client_key: test-client-key-2v1

logging:
  system:
    level: "error"
    destination: "stdout"
