schema: "1.0.0"
id: distillery-memory-test
description: "Formation for testing the memory distillery endpoint (Memory Distillery Phase 3b)"
auto_extract_user_info: true

runtime:
  built_in_mcps: false

overlord:
  clarification:
    enabled: false

llm:
  settings:
    temperature: 0.2
    max_tokens: 1000
  api_keys:
    openai: "${{ secrets.OPENAI_API_KEY }}"
  models:
    - text: "openai/gpt-4o-mini"
    - embedding: "openai/text-embedding-3-small"

memory:
  buffer:
    size: 50
    multiplier: 10
    vector_search: false

  persistent:
    provider: "sqlite"
    connection_string: "distillery_test.db"
    embedding_model: "openai/text-embedding-3-small"

  # Chat-context recall searches these collections (the clean-context
  # default is conversations only); distilled facts land in the
  # collections the distillery declares per event.
  long_term:
    collections: ["conversations", "preferences", "context"]

  # Memory distillery (Phase 3b): opt-in intake for signed batches of
  # pre-distilled events from a registered on-prem distillery. Without
  # this section the endpoint answers 503 and nothing else changes.
  distillery:
    enabled: true
    default_trust_level: verified
    signature_max_age_seconds: 300

agents:
  - id: assistant
    name: "Distillery Test Assistant"
    description: "A helpful assistant for testing distilled memory recall"
    system_message: "You are a helpful assistant. Be concise and direct. Answer from the provided context when possible."

server:
  enabled: true
  port: 8274
  api_keys:
    admin_key: test-admin-key-2w1
    client_key: test-client-key-2w1

logging:
  system:
    level: "error"
    destination: "stdout"
