schema: "1.0.0"
id: "memory-test-local-768"
description: "Formation for testing local 768-dim embeddings (all-mpnet-base-v2)"

runtime:
  built_in_mcps: false

overlord:
  clarification:
    enabled: false

llm:
  settings:
    temperature: 0.7
    max_tokens: 500
  api_keys:
    openai: "${{ secrets.OPENAI_API_KEY }}"
  models:
    - text: "openai/gpt-4o-mini"
    - embedding: "local/all-mpnet-base-v2"

memory:
  buffer:
    size: 10
    vector_search: false

  persistent:
    connection_string: "${{ secrets.POSTGRES_URI }}"
    embedding_model: "local/all-mpnet-base-v2"

logging:
  system:
    level: "debug"
    destination: "stdout"

agents:
  - id: "test-agent"
    name: "Test Agent"
    description: "Agent for testing local 768 embeddings"
    model: "openai/gpt-4o-mini"
    system_message: "You are a helpful assistant. Remember what users tell you."
