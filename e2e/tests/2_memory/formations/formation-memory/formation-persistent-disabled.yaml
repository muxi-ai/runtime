schema: "1.0.0"
id: "persistent-disabled-test"
description: "Formation with persistent memory explicitly disabled"

runtime:
  built_in_mcps: false

llm:
  settings:
    temperature: 0.7
    max_tokens: 500
  api_keys:
    openai: "${{ secrets.OPENAI_API_KEY }}"
  models:
    - text: "openai/gpt-4o-mini"

agents:
  - id: "basic-agent"
    name: "Basic Agent"
    description: "Agent for testing disabled persistent memory"
    model: "openai/gpt-4o-mini"
    specialty: "general"
    system_message: |
      You are a helpful assistant. Answer questions concisely.

memory:
  buffer:
    size: 10
  working:
    max_memory_mb: 10
  persistent: false  # Explicitly disable persistent memory

overlord:
  agent_assignment:
    strategy: "simple"
  config:
    response:
      timeout: 30
