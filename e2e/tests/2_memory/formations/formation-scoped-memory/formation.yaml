schema: "1.0.0"
id: scoped-memory-test
description: "Formation for testing shared memory scopes (memory namespaces Phases 2+3)"

runtime:
  built_in_mcps: false

overlord:
  clarification:
    enabled: false

llm:
  settings:
    temperature: 0.2
    max_tokens: 1000
  api_keys:
    openai: "${{ secrets.OPENAI_API_KEY }}"
  models:
    - text: "openai/gpt-4o-mini"
    - embedding: "openai/text-embedding-3-small"

memory:
  buffer:
    size: 50
    multiplier: 10
    vector_search: false

  persistent:
    connection_string: "${{ secrets.POSTGRES_URI }}"
    embedding_model: "openai/text-embedding-3-small"

agents:
  - id: assistant
    name: "Scoped Memory Test Assistant"
    description: "A helpful assistant for testing scoped memory recall"
    system_message: "You are a helpful assistant. Be concise and direct. Answer from the provided context when possible."

# Request middleware: the only membership source (template example
# reading a static user -> groups map).
middleware:
  command: "./middleware.py"
  args: ["--map", "groups.json"]
  timeout: 5s

rbac:
  fallback: false

server:
  enabled: true
  port: 8272
  api_keys:
    admin_key: test-admin-key-2u1
    client_key: test-client-key-2u1

logging:
  system:
    level: "error"
    destination: "stdout"
