schema: "1.0.0"
id: mcp-server-test-formation
description: "Formation for testing MCP server interface"

llm:
  api_keys:
    openai: "${{ secrets.OPENAI_API_KEY }}"
  models:
    - text: "openai/gpt-4o-mini"
    - embedding: "openai/text-embedding-3-small"

runtime:
  built_in_mcps: false

memory:
  buffer:
    size: 100
    vector_search: false

agents:
  - id: assistant
    name: "MCP Test Assistant"
    description: "A helpful assistant for testing MCP server interface"
    system_message: "You are a helpful assistant. Be concise and direct."

server:
  enabled: true
  port: 8271
  api_keys:
    admin_key: test-admin-key
    client_key: test-client-key
