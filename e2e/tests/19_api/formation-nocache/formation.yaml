schema: "1.0.0"
id: api-test-nocache
description: "Formation for testing - no LLM cache"

llm:
  api_keys:
    openai: "${{ secrets.OPENAI_API_KEY }}"
  models:
    - text: "openai/gpt-4o-mini"
  settings:
    caching:
      enabled: false  # Disable caching

runtime:
  built_in_mcps: false

memory:
  buffer:
    size: 10
    vector_search: false

agents:
  - id: assistant
    name: "Test Assistant"
    description: "Test agent"
    system_message: "You are a test assistant."

server:
  enabled: true
  port: 8271
  api_keys:
    admin_key: test-admin-key-123
    client_key: test-client-key-456
