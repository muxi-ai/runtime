schema: "1.0.0"
id: api-test-groups-open
description: "Formation combining groups/ with default (open) auth -- must FAIL to load (2026-07-07 ruling)"

llm:
  api_keys:
    openai: "${{ secrets.OPENAI_API_KEY }}"
  models:
    - text: "openai/gpt-4o-mini"
    - embedding: "openai/text-embedding-3-small"

runtime:
  built_in_mcps: false

memory:
  buffer:
    size: 100
    vector_search: false

agents:
  - id: assistant
    name: "Group Loading Test Assistant"
    description: "A helpful assistant for testing group permission loading"
    system_message: "You are a helpful assistant. Be concise and direct."

server:
  enabled: true
  port: 8271
  # auth deliberately absent (default: open) -- with groups/ present this
  # formation must fail to load with a clear error
  api_keys:
    admin_key: test-admin-key-123
    client_key: test-client-key-456

logging:
  system:
    level: "error"
    destination: "stdout"
