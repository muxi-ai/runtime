schema: "1.0.0"
id: api-test-formation-full
description: "Enhanced formation for testing all API endpoints (MCP, scheduler, A2A, triggers)"

llm:
  api_keys:
    openai: "${{ secrets.OPENAI_API_KEY }}"
  models:
    - text: "openai/gpt-4o-mini"
    - embedding: "openai/text-embedding-3-small"

runtime:
  built_in_mcps: false

# Scheduler Configuration (requires persistent memory with DB)
# scheduler:
#   enabled: true
#   timezone: "UTC"
#   check_interval_minutes: 1
#   max_concurrent_jobs: 5
#   max_failures_before_pause: 3

# A2A Configuration (enabled by default)
a2a:
  enabled: true

# MCP Configuration
mcp:
  enhance_user_prompts: true
  max_tool_calls: 50
  max_tool_iterations: 10
  default_retry_attempts: 3
  default_timeout_seconds: 30

memory:
  buffer:
    size: 100
    vector_search: false

agents:
  - id: assistant
    name: "API Test Assistant"
    description: "A helpful assistant for testing API endpoints"
    system_message: "You are a helpful assistant. Be concise and direct."

server:
  enabled: true
  port: 8271
  api_keys:
    admin_key: test-admin-key-123
    client_key: test-client-key-456

# Logging for debugging
logging:
  enabled: true
  streams:
    - transport: "stdout"
      level: "info"
      format: "jsonl"
