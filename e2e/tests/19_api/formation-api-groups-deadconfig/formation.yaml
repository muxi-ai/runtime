schema: "1.0.0"
id: api-test-groups-deadconfig
description: "RBAC active + fallback false + no middleware: every request would be rejected -- must FAIL to load"

llm:
  api_keys:
    openai: "${{ secrets.OPENAI_API_KEY }}"
  models:
    - text: "openai/gpt-4o-mini"
    - embedding: "openai/text-embedding-3-small"

runtime:
  built_in_mcps: false

memory:
  buffer:
    size: 100
    vector_search: false

agents:
  - id: assistant
    name: "Group Loading Test Assistant"
    description: "A helpful assistant for testing group permission loading"
    system_message: "You are a helpful assistant. Be concise and direct."

# groups/ exists (rbac auto-activates), fallback defaults to false, and
# no middleware block is declared: dead configuration, fail fast.

server:
  enabled: true
  port: 8271
  api_keys:
    admin_key: test-admin-key-123
    client_key: test-client-key-456

logging:
  system:
    level: "error"
    destination: "stdout"
