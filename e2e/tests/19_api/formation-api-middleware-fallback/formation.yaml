schema: "1.0.0"
id: api-test-middleware-fallback
description: "rbac.fallback path: requests without groups proceed with the public group"

llm:
  api_keys:
    openai: "${{ secrets.OPENAI_API_KEY }}"
  models:
    - text: "openai/gpt-4o-mini"
    - embedding: "openai/text-embedding-3-small"

runtime:
  built_in_mcps: false

memory:
  buffer:
    size: 100
    vector_search: false

agents:
  - id: assistant
    name: "Middleware Pipeline Test Assistant"
    description: "A helpful assistant for testing the request middleware pipeline"
    system_message: "You are a helpful assistant. Be concise and direct."

middleware:
  command: "./middleware.py"
  args: ["--map", "groups.json"]
  timeout: 5s

rbac:
  fallback: public

server:
  enabled: true
  port: 8271
  api_keys:
    admin_key: test-admin-key-123
    client_key: test-client-key-456

logging:
  system:
    level: "error"
    destination: "stdout"
