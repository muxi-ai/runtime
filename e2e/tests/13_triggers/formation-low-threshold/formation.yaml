schema: "1.0.0"
id: formation-triggers-low-threshold
name: Trigger Low Threshold Test
description: Test formation with very low approval threshold to verify bypass works

llm:
  api_keys:
    openai: "${{ secrets.OPENAI_API_KEY }}"
  models:
    - text: "openai/gpt-4o-mini"

overlord:
  workflow:
    auto_decomposition: true
    complexity_threshold: 1.0  # VERY low - almost everything triggers workflow
    plan_approval_threshold: 2.0  # VERY low - most workflows require approval

agents:
  - id: test-agent
    name: Test Agent
    description: Simple agent for low threshold testing
    system_message: |
      You are a test agent. Process requests concisely and confirm you received them.
      Keep responses under 100 words.
    default: true

server:
  host: 0.0.0.0
  port: 18272
  access_log: false
  api_keys:
    admin_key: "testing-api-key"
    client_key: "testing-api-key"
