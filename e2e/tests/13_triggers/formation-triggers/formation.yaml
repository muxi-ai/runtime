schema: "1.0.0"
id: formation-triggers-test
name: Trigger System Test Formation
description: Test formation for trigger endpoints and template rendering

llm:
  api_keys:
    openai: "${{ secrets.OPENAI_API_KEY }}"
  models:
    - text: "openai/gpt-4o-mini"

agents:
  - id: test-agent
    name: Test Agent
    description: Simple agent for trigger testing
    system_message: |
      You are a test agent. When you receive trigger messages, respond concisely with:
      - A confirmation you received the message
      - The key information from the message
      Keep responses under 50 words.
    default: true

server:
  host: 0.0.0.0
  port: 18271
  access_log: false
  api_keys:
    admin_key: "testing-api-key"
    client_key: "testing-api-key"
