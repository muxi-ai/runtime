# Multi-Identity Test Formation
# Simple formation for testing multi-identity user management

formation_id: multi_identity_test
name: Multi-Identity Test Formation

llm:
  models:
    - text: "openai/gpt-4o-mini"

memory:
  long_term:
    enabled: true
    auto_extract: true

agents:
  - name: assistant
    role: helpful_assistant
    description: A helpful assistant for testing
    instructions: |
      You are a helpful assistant. Remember what users tell you about themselves.
      When asked about user preferences, recall from memory what they've shared.
