schema: "1.0.0"
id: sop-skills-test-formation
description: "Formation for testing SOP skill directive integration"

llm:
  api_keys:
    openai: "${{ secrets.OPENAI_API_KEY }}"
  models:
    - text: "openai/gpt-4o-mini"

runtime:
  built_in_mcps: false

memory:
  buffer:
    size: 10
    vector_search: false

skills:
  - test-skill

agents:
  - test-agent

workflow:
  auto_decomposition: true
  complexity_threshold: 1.0
  plan_approval_threshold: 10

overlord:
  clarification:
    style: "brief"

logging:
  system:
    level: "error"
    destination: "stdout"
