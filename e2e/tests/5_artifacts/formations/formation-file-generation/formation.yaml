schema: "1.0.0"
id: "file-generation-test"
description: "Formation with built-in MCP file generation enabled"

llm:
  api_keys:
    openai: "${{ secrets.OPENAI_API_KEY }}"
    anthropic: "${{ secrets.ANTHROPIC_API_KEY }}"
    google: "${{ secrets.GEMINI_API_KEY }}"
  models:
    - text: "openai/gpt-4o-mini"
    - vision: "google/gemini-2.5-flash"
    - video: "google/gemini-2.5-flash"
    - audio: "openai/whisper-1"
    - documents: "openai/gpt-4o"
      settings:
        max_size_mb: 20
        extraction:
          chunk_size: 1000
          overlap: 100
          strategy: "adaptive"
    - embedding: "openai/text-embedding-3-small"

agents:
  - generator

memory:
  buffer:
    size: 50
    multiplier: 10
    vector_search: false

logging:
  system:
    level: "debug"
    destination: "stdout"
  conversation:
    enabled: true
    streams:
      - transport: "stdout"
        level: "info"
        format: "jsonl"

# Agent and MCP configuration will be auto-discovered from directories
