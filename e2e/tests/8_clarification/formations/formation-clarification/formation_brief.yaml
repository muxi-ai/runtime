description: Single agent formation with minimal memory for clarification testing
id: clarification-test
llm:
  api_keys:
    openai: ${{ secrets.OPENAI_API_KEY }}
  models:
  - text: openai/gpt-4o-mini
  settings:
    max_tokens: 2000
    temperature: 0.7
logging:
  system:
    level: "debug"
    destination: "stdout"
  conversation:
    enabled: true
    streams:
      - format: jsonl
        level: info
        transport: stdout
memory:
  buffer:
    multiplier: 5
    size: 10
    vector_search: false
overlord:
  clarification:
    style: brief
schema: 1.0.0
