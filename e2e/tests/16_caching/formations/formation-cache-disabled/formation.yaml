---
schema: "1.0.0"
id: "test-cache-disabled"
description: "Test formation with caching explicitly disabled"

llm:
  settings:
    temperature: 0.7
    max_tokens: 100
    caching:
      enabled: false  # Explicitly disable caching

  api_keys:
    openai: "${{ secrets.OPENAI_API_KEY }}"

  models:
    - text: "openai/gpt-4o-mini"
      settings:
        temperature: 0.7

agents:
  - schema: "1.0.0"
    id: "test-agent"
    name: "Test Agent"
    description: "Simple test agent for caching tests"
    system_message: "You are a test assistant. Keep responses brief."

memory:
  buffer:
    size: 5
    vector_search: false
