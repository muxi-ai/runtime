schema: "1.0.0"
id: standard-test-formation
description: Standard formation template for most E2E tests

# LLM Configuration (REQUIRED)
llm:
  api_keys:
    openai: "${{ secrets.OPENAI_API_KEY }}"
  models:
    - text: "openai/gpt-4o-mini"
  settings:
    temperature: 0.7
    max_tokens: 4096

# Memory Configuration
memory:
  buffer:
    size: 10
    multiplier: 10
    vector_search: true

# Runtime configuration
runtime:
  built_in_mcps: false  # Disable for faster test startup

# Agent Configuration
agents:
  - id: assistant
    name: Test Assistant
    description: General-purpose test assistant
    system_message: |
      You are a helpful AI assistant for testing purposes.
      Respond concisely and accurately to test queries.
      Your responses will be validated by automated tests.

# Optional Overlord configuration
overlord:
  clarification:
    style: "brief"
    max_rounds:
      direct: 3
      brainstorm: 5
      planning: 5
      execution: 3

# Async configuration
async:
  threshold_seconds: 30
  enable_estimation: false

# Logging configuration
logging:
  enabled: true
  streams:
    - transport: "stdout"
      level: "info"
      format: "jsonl"
