schema: "1.0.0"
id: complex-test-formation
description: Complex formation template for advanced multi-agent tests
secrets_file: secrets.enc

# LLM Configuration with multiple models
llm:
  api_keys:
    openai: "${{ secrets.OPENAI_API_KEY }}"
  models:
    - text: "openai/gpt-4o-mini"
    - vision: "openai/gpt-4-vision-preview"
    - embedding: "openai/text-embedding-3-small"
  settings:
    temperature: 0.7
    max_tokens: 4096

# Advanced Memory Configuration
memory:
  buffer:
    size: 20
    multiplier: 10
    vector_search: true
  persistent:
    connection_string: "sqlite:///test_memory.db"
    embedding_model: "openai/text-embedding-3-small"
  working:
    max_memory_mb: 256
    mode: "local"
    vector_dimension: 1536

# Runtime configuration
runtime:
  built_in_mcps: false  # Disable for faster test startup

# Overlord configuration for advanced workflows
overlord:
  workflow:
    auto_decomposition: true
    complexity_threshold: 5.0
    max_parallel_tasks: 3
    enable_agent_affinity: true
  clarification:
    style: "conversational"
    max_rounds:
      direct: 5
      planning: 7
      execution: 3

# Multiple Agents
agents:
  - id: orchestrator
    name: Test Orchestrator
    description: Coordinates multi-agent test scenarios
    system_message: |
      You are the orchestrator for complex test scenarios.
      Coordinate between agents to accomplish test objectives.
      Delegate tasks based on agent specializations.
    role: "general"
    specialties:
      - orchestration
      - planning
      - delegation

  - id: researcher
    name: Test Researcher
    description: Handles research and knowledge queries
    system_message: |
      You are a research specialist for testing.
      Find and provide accurate information for test queries.
    role: "specialist"
    specialties:
      - research
      - knowledge
      - search

  - id: writer
    name: Test Writer
    description: Handles content generation tests
    system_message: |
      You are a content writer for testing purposes.
      Generate requested content accurately and concisely.
    role: "specialist"
    specialties:
      - writing
      - generation
      - formatting

# MCP Server Configuration
mcp:
  default_timeout_seconds: 30
  max_tool_iterations: 10
  enhance_user_prompts: true

# Advanced Features
async:
  threshold_seconds: 60
  enable_estimation: true
  webhook_url: "http://localhost:8080/webhook"
  webhook_retries: 3

# A2A Configuration
a2a:
  enabled: false
  outbound:
    registries:
      - "http://localhost:8090"
    default_retry_attempts: 3

# Logging configuration
logging:
  enabled: true
  streams:
    - transport: "stdout"
      level: "debug"
      format: "jsonl"
    - transport: "file"
      destination: "./test.log"
      level: "debug"
      format: "text"