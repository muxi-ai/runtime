schema: "1.0.0"
id: formation-heartbeat-middleware-test
description: Heartbeat traversing the request middleware + RBAC pipeline (request-middleware PRD)

llm:
  api_keys:
    openai: "${{ secrets.OPENAI_API_KEY }}"
  models:
    - text: "openai/gpt-4o-mini"
    - embedding: "openai/text-embedding-3-small"

agents:
  - id: assistant
    name: Assistant
    description: Simple assistant for heartbeat middleware testing
    system_message: |
      You are a test assistant. Follow instructions exactly and keep
      responses under 30 words.
    default: true

overlord:
  workflow:
    auto_decomposition: true
    complexity_threshold: 9.0
  response:
    streaming: false
    widgets: false

# Request middleware: the only membership source. The fixture also
# audits every call (route_class + user) to middleware_calls.log so the
# test can prove internal origins traverse the pipeline.
middleware:
  command: "./middleware.py"
  timeout: 5s

rbac:
  fallback: false

server:
  host: 0.0.0.0
  port: 18232
  access_log: false
  api_keys:
    admin_key: "testing-api-key"
    client_key: "testing-api-key"

memory:
  working:
    max_memory_mb: 1
    vector_dimension: 1536
    mode: "local"
  buffer:
    size: 50
    multiplier: 10
    vector_search: false
  persistent:
    connection_string: "${{ secrets.POSTGRES_URI }}"
    embedding_model: "openai/text-embedding-3-small"

scheduler:
  enabled: true
  timezone: "UTC"
  check_interval_minutes: 1
  max_concurrent_jobs: 5

proactive:
  channels:
    chan-b:
      transformer: sink-b
  default_channel: chan-b
  heartbeat:
    enabled: true
    interval: "2h"
    target: last
    active_hours:
      start: "00:00"
      end: "23:59"
      timezone: "UTC"
      weekends: true
    sop: heartbeat-e2e

logging:
  system:
    level: "error"
    destination: "stdout"
  conversation:
    enabled: false
