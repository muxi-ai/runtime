schema: "1.0.0"
id: "web-search-mcp"
description: "Web search using free google search"

type: "command"

command: "npx"
args: ["-y", "brave-search-mcp"]
timeout_seconds: 60

# Authentication (optional)
auth:
  type: "env"
  DUMMY_KEY: "DUMMY_VALUE"
  # BRAVE_API_KEY: "${{ secrets.BRAVE_API_KEY }}"
  # BRAVE_API_KEY: "${{ secrets.BRAVE_API_KEY }}"
  BRAVE_API_KEY: "${{ user.credentials.BRAVE_SEARCH }}"
