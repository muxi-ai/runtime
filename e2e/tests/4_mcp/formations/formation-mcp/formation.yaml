schema: "1.0.0"
id: "test_formation"
description: "Formation for testing mcp servers"

llm:
  api_keys:
    openai: "${{ secrets.OPENAI_API_KEY }}"
    anthropic: "${{ secrets.ANTHROPIC_API_KEY }}"
    google: "${{ secrets.GEMINI_API_KEY }}"
  models:
    - text: "openai/gpt-4o-mini"
    - vision: "google/gemini-2.0-flash"
    - video: "google/gemini-2.0-flash"
    - audio: "openai/whisper-1"
    - documents: "openai/gpt-4o"
      settings:
        max_size_mb: 20
        extraction:
          chunk_size: 1000
          overlap: 100
          strategy: "adaptive"
    - embedding: "openai/text-embedding-3-small"

runtime:
  built_in_mcps: false
  mcp_server_startup_timeout: 30  # Increase timeout to 30 seconds

# Disable workflow decomposition for all credential tests
# This ensures direct agent-to-MCP-tool calls which trigger credential errors properly
overlord:
  workflow:
    auto_decomposition: false

# Credential handling configuration  
user_credentials:
  mode: "dynamic"  # Dynamic mode allows credentials to be provided in chat

mcp:
  enhance_user_prompts: true  # Enable message enhancement for better tool selection
  max_tool_calls: 50
  max_tool_iterations: 10

memory:
  working:
    max_memory_mb: 1
    fifo_interval_min: 5
    vector_dimension: 1536
    mode: "local"

  buffer:
    size: 50
    multiplier: 10
    vector_search: true

  persistent:
    connection_string: "${{ secrets.POSTGRES_URI }}"
    embedding_model: "openai/text-embedding-3-small"

logging:
  enabled: true
  streams:
    # File example
    - transport: "file"
      level: "debug"
      format: "jsonl"
      destination: "/Users/ran/Desktop/mcp.log"
      events: ["*"]
