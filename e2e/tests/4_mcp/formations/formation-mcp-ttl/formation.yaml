schema: "1.0.0"
id: "test_formation_mcp_ttl"
description: "Formation for testing MCP connection TTL / keep-alive"

llm:
  api_keys:
    openai: "${{ secrets.OPENAI_API_KEY }}"
  models:
    - text: "openai/gpt-4o-mini"

runtime:
  built_in_mcps: false

agents:
  - agent

overlord:
  workflow:
    auto_decomposition: false

mcp:
  connection_ttl: 300
  servers:
    - system-mcp

memory:
  working:
    max_memory_mb: 1
    mode: "local"
  buffer:
    size: 5
    vector_search: false

logging:
  system:
    level: "error"
    destination: "stdout"
