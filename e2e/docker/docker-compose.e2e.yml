version: '3.8'

services:
  # PostgreSQL for persistent memory storage
  postgres:
    image: postgres:15-alpine
    container_name: muxi-e2e-postgres
    environment:
      POSTGRES_USER: muxi
      POSTGRES_PASSWORD: muxi_test_password
      POSTGRES_DB: muxi_test
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muxi"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - muxi-test

  # FAISSx vector database service (NO AUTH)
  faissx-no-auth:
    image: python:3.10-slim
    container_name: muxi-e2e-faissx-no-auth
    ports:
      - "45678:45678"
    command: |
      bash -c "pip install faissx && faissx.server run --port 45678"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:45678/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - muxi-test

  # FAISSx vector database service (WITH AUTH)
  faissx-with-auth:
    image: python:3.10-slim
    container_name: muxi-e2e-faissx-with-auth
    ports:
      - "65432:65432"
    volumes:
      - ../tests/assets/formations/faissx-auth.json:/app/faissx-auth.json
    command: |
      bash -c "pip install faissx && faissx.server run --port 65432 --enable-auth --auth-file /app/faissx-auth.json"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:65432/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - muxi-test

  # Webhook testing server
  webhook:
    image: python:3.10-slim
    container_name: muxi-e2e-webhook
    ports:
      - "8080:8080"
    volumes:
      - ../utils/webhook_server.py:/app/webhook_server.py
    working_dir: /app
    command: python webhook_server.py
    networks:
      - muxi-test

  # A2A Registry service (Agent-to-Agent communication)
  a2a-registry:
    image: python:3.10-slim
    container_name: muxi-e2e-a2a
    ports:
      - "8090:8090"
    volumes:
      - ../utils/a2a_registry.py:/app/a2a_registry.py
    working_dir: /app
    command: python a2a_registry.py
    networks:
      - muxi-test

networks:
  muxi-test:
    driver: bridge

volumes:
  postgres_data:
