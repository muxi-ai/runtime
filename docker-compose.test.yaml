version: '3.8'

services:
  muxi-runtime:
    build:
      context: .
      dockerfile: Dockerfile
    image: muxi-runtime:test
    container_name: muxi-runtime-test
    ports:
      - "8000:8000"
    volumes:
      # Mount the test formation
      - ./examples:/formations:ro
    environment:
      # API Keys (set these before running)
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      
      # Optional: Override server config
      # FORMATION_HOST: "0.0.0.0"
      # FORMATION_PORT: "8000"
    command: /formations/test-formation.yaml
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    
    # Resource limits (optional)
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    
    # Restart policy
    restart: unless-stopped
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
