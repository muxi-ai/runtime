schema: 1.0.0
id: workflow-test
name: "Workflow Test Formation"
description: "Multi-agent formation for testing workflow decomposition without MCP"
version: "1.0.0"

# Agents for workflow testing
agents:
  - id: researcher
    name: "Research Specialist"
    description: "Handles research and information gathering"
    model: "openai/gpt-4o-mini"
    system_message: |
      You are a research specialist. Your job is to gather information,
      analyze data, and provide comprehensive research findings.

  - id: writer
    name: "Content Writer"
    description: "Creates documents and written content"
    model: "openai/gpt-4o-mini"
    system_message: |
      You are a content writer. Your job is to create well-structured
      documents, reports, and written content based on provided information.

  - id: analyst
    name: "Data Analyst"
    description: "Analyzes data and creates insights"
    model: "openai/gpt-4o-mini"
    system_message: |
      You are a data analyst. Your job is to analyze information,
      identify patterns, and provide data-driven insights.

# Overlord configuration
overlord:
  llm:
    model: "openai/gpt-4o-mini"
    settings:
      temperature: 0.2
      max_tokens: 2000

  config:
    # Workflow settings
    auto_decomposition: true
    complexity_threshold: 6.0
    plan_approval_threshold: 10

# Memory configuration
memory:
  buffer:
    enabled: true
    size: 20
  working:
    enabled: true

# Capability models
llm:
  api_keys:
    openai: "${{ secrets.OPENAI_API_KEY }}"
  models:
    - text: "openai/gpt-4o-mini"
    - embedding: "openai/text-embedding-3-small"
