schema: "1.0.0"
id: "basic-memory-test"
description: "Simple formation for testing basic buffer memory functionality"

llm:
  api_keys:
    test: "test-key"
  models:
    - text: "test/mock"
      
agents:
  - id: "basic-agent"
    name: "Basic Memory Agent"
    description: "Agent for testing buffer memory"
    model: "test/mock"
    specialty: "general"
    system_message: |
      You are a helpful assistant with memory capabilities.
      Remember what users tell you and use that information in responses.

memory:
  buffer:
    size: 10  # Small buffer for testing overflow
  working:
    max_memory_mb: 10
  
overlord:
  agent_assignment:
    strategy: "simple"
  config:
    response:
      timeout: 30
      async_threshold: 50000