schema: "1.0.0"
id: "buffer-memory-remote-test"
name: "buffer-memory-remote-test"
description: "Test formation for remote buffer memory mode"

runtime:
  built_in_mcps: false

agents:
  - id: "memory-assistant"
    name: "Memory Test Assistant"
    description: "Assistant for testing remote buffer memory"
    role: "assistant"
    system_message: "You are a helpful assistant that remembers conversation context. Always acknowledge what you remember about the user."
    model: "test/mock-model"

memory:
  buffer:
    enabled: true
    size: 10
    multiplier: 5
    vector_search: true
    vector_dimension: 1536
    mode: "remote"
    remote:
      url: "tcp://localhost:45678"
      # Note: This will likely fail gracefully since no real remote server
      # But it tests the configuration path
  
  persistent:
    enabled: false

llm:
  models:
    - text: "test/mock-model"
      api_key: "mock-key"
      settings:
        temperature: 0.7
    - embedding: "test/mock-embedding"
      api_key: "mock-key"