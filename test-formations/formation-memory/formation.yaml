schema: "1.0.0"
id: "memory-test-formation"
description: "Formation for testing buffer and persistent memory systems"

llm:
  settings:
    temperature: 0.7
    max_tokens: 2000
  api_keys:
    openai: "${{ secrets.OPENAI_API_KEY }}"
  models:
    - text: "openai/gpt-4o"
    - embedding: "openai/text-embedding-3-small"

memory:
  working:
    max_memory_mb: 256
    fifo_interval_min: 5
    vector_dimension: 1536
    mode: "local"
    
  buffer:
    size: 50
    multiplier: 10
    vector_search: true
    
  persistent:
    connection_string: "sqlite:///sqlite.db"
    embedding_model: "openai/text-embedding-3-small"

logging:
  streams:
    - transport: "stdout"
      level: "debug"
      format: "jsonl"

# Agent will be auto-discovered from agents/ directory