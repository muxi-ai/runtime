schema: "1.0.0"
id: "approval-test"
description: "Test formation with low approval threshold"

llm:
  api_keys:
    openai: "${{ secrets.OPENAI_API_KEY }}"
  
  models:
    - text: "openai/gpt-4o-mini"

overlord:
  streaming: false
  
  llm:
    model: "openai/gpt-4o-mini"
  
  config:
    # Workflow configuration with LOW approval threshold
    auto_decomposition: true
    plan_approval_threshold: 5  # LOW threshold to trigger approval
    
    workflow:
      complexity_threshold: 4.0  # LOW to trigger workflow easily
      routing_strategy: "capability_based"
      
      retry:
        max_attempts: 3
        initial_delay: 1.0
        backoff_factor: 2.0

memory:
  buffer:
    size: 20

agents:
  - id: "assistant"
    name: "Assistant"
    description: "General purpose assistant"
    system_message: "You are a helpful assistant."
    role: "generalist"