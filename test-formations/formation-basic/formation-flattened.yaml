schema: "1.0.0"
id: "basic-test-formation"
description: "Single agent formation with minimal memory for basic testing"

llm:
  settings:
    temperature: 0.7
    max_tokens: 2000
  api_keys:
    openai: "${{ secrets.OPENAI_API_KEY }}"
  models:
    - text: "openai/gpt-4o-mini"

memory:
  buffer:
    size: 10
    multiplier: 5
    vector_search: false

logging:
  streams:
    - transport: "stdout"
      level: "info"
      format: "jsonl"

# Agent will be added manually here, but will also be auto-discovered from agents/ directory
agents:
  - id: "inline-assistant"
    name: "Inline Assistant"
    description: "General purpose assistant for testing basic formation functionality"
    system_message: |
      You are a helpful AI assistant designed for testing the MUXI runtime.
      Respond concisely and accurately to user queries.
      You can handle general conversation, simple math, and basic reasoning tasks.
    role: "general"
    specialties:
      - "general_conversation"
      - "simple_math"
      - "basic_reasoning"

# MCP service configuration
mcp:
  default_retry_attempts: 3 # Default number of retry attempts
  default_timeout_seconds: 30 # Default tool call timeout

  # MCP server configuration
  # Optionally, initiate as an empty list or with an explicit list of servers.
  servers:
    - id: "local-tools"                  # Unique server name/id (required)
      description: "Local command tools" # Human-readable description
      active: true                       # optional; true (exists for start/stop commands)

      type: "command"                    # Server type: command (required)
      install: "npm install -g @modelcontextprotocol/server-json-rpc" # Optional: Command to install the server
      # Command execution details
      command: "npx"                     # Command to execute (required)
      args: ["-y", "@modelcontextprotocol/server-json-rpc"]  # Command arguments (optional)
      timeout_seconds: 60                # Command timeout (overrides default)
      env:                               # Environment variables (optional)
        DEBUG: "true"
