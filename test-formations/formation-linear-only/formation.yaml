schema: "1.0.0"
id: "linear-only-test"
description: "Minimal formation for Linear issue creation with robust retry"

llm:
  api_keys:
    openai: "${{ secrets.OPENAI_API_KEY }}"
  
  models:
    - text: "openai/gpt-4o-mini"
      settings:
        temperature: 0.7
        max_tokens: 2000

overlord:
  streaming: false
  
  llm:
    model: "openai/gpt-4o-mini"
  
  config:
    # Workflow configuration
    auto_decomposition: false
    complexity_threshold: 100.0
    
    workflow:
      routing_strategy: "capability_based"
      parallel_execution: true
      max_parallel_tasks: 5
      
      # Robust retry configuration
      error_recovery: "retry_with_backoff"
      retry:
        max_attempts: 5
        initial_delay: 2.0
        backoff_factor: 2.0
        max_delay: 120.0
      
      timeouts:
        task_timeout: 300
        workflow_timeout: 1800

memory:
  buffer:
    size: 20

# Minimal agent - just one that can create Linear issues
agents:
  - id: "linear-agent"
    name: "Linear Agent"
    description: "Agent specialized in creating Linear issues"
    system_message: |
      You are a Linear issue creation specialist. Your primary task is to create 
      well-structured Linear issues based on research topics. Always include both 
      a clear title and detailed content in the issues you create.
    role: "specialist"
    specialties:
      - "linear"
      - "documentation"