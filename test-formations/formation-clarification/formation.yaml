schema: "1.0.0"
id: "clarification-test"
description: "Single agent formation with minimal memory for clarification testing"

llm:
  settings:
    temperature: 0.7
    max_tokens: 2000
  api_keys:
    openai: "${{ secrets.OPENAI_API_KEY }}"
  models:
    - text: "openai/gpt-5-nano"

memory:
  buffer:
    size: 10
    multiplier: 5
    vector_search: false

logging:
  streams:
    - transport: "stdout"
      level: "info"
      format: "jsonl"

