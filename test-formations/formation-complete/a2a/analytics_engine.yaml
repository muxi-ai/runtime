schema: "1.0.0"
id: "analytics_engine"
name: "External Analytics Engine"
description: "External service for advanced analytics and machine learning operations"
url: "https://analytics.example.com/a2a"
active: true

retry_attempts: 5
timeout_seconds: 60

auth:
