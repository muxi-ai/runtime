# MUXI Runtime Release Workflow
#
# RELEASE FLOW:
#   develop → rc (PR) → main (merge) → auto-release
#
# VERSION FORMAT (ScalVer):
#   MAJOR.YYYYMMDD.PATCH
#
name: Release

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: muxi-ai/runtime

jobs:
  # ===== Version Calculation & Tagging =====
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: "!startsWith(github.event.head_commit.message, 'chore: release')"
    outputs:
      version: ${{ steps.version.outputs.VERSION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.MUXI_RELEASE_TOKEN }}

      - name: Calculate next version (ScalVer)
        id: version
        run: |
          CURRENT_VERSION=$(cat src/muxi/runtime/.version 2>/dev/null || echo "0.20000101.0")
          MAJOR=$(echo $CURRENT_VERSION | cut -d. -f1)
          CURRENT_DATE=$(echo $CURRENT_VERSION | cut -d. -f2)
          CURRENT_PATCH=$(echo $CURRENT_VERSION | cut -d. -f3)
          TODAY=$(date +%Y%m%d)

          if [ "$CURRENT_DATE" = "$TODAY" ]; then
            NEXT_PATCH=$((CURRENT_PATCH + 1))
            NEXT_VERSION="${MAJOR}.${TODAY}.${NEXT_PATCH}"
          else
            NEXT_VERSION="${MAJOR}.${TODAY}.0"
          fi

          echo "VERSION=$NEXT_VERSION" >> $GITHUB_OUTPUT
          echo "Current: $CURRENT_VERSION -> Next: v$NEXT_VERSION"

      - name: Update version and CHANGELOG
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          TODAY=$(date +%Y-%m-%d)

          echo "$VERSION" > src/muxi/runtime/.version

          if grep -q "## \[Unreleased\]" CHANGELOG.md; then
            sed -i.bak "s/## \[Unreleased\]/## [$VERSION] - $TODAY/" CHANGELOG.md
            rm -f CHANGELOG.md.bak
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/muxi/runtime/.version CHANGELOG.md

          if ! git diff --cached --quiet; then
            git commit -m "chore: release v$VERSION"
            git push
          fi

      - name: Create git tag
        run: |
          TAG="v${{ steps.version.outputs.VERSION }}"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG"
          fi

  # ===== Docker Build (AMD64) - Native =====
  docker-amd64:
    runs-on: ubuntu-latest
    needs: version
    permissions:
      packages: write

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.version.outputs.version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ needs.version.outputs.version }}-amd64
          platforms: linux/amd64
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

  # ===== Docker Build (ARM64) - Native =====
  docker-arm64:
    runs-on: ubuntu-24.04-arm
    needs: version
    permissions:
      packages: write

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.version.outputs.version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ needs.version.outputs.version }}-arm64
          platforms: linux/arm64
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

  # ===== Create Multi-Arch Manifest =====
  docker-manifest:
    runs-on: ubuntu-latest
    needs: [version, docker-amd64, docker-arm64]
    permissions:
      packages: write

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create and push manifest
        run: |
          VERSION="v${{ needs.version.outputs.version }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          # Create multi-arch manifest using buildx imagetools
          docker buildx imagetools create -t ${IMAGE}:${VERSION} \
            ${IMAGE}:${VERSION}-amd64 \
            ${IMAGE}:${VERSION}-arm64

          docker buildx imagetools create -t ${IMAGE}:latest \
            ${IMAGE}:${VERSION}-amd64 \
            ${IMAGE}:${VERSION}-arm64

          echo "Created multi-arch manifests for ${VERSION} and latest"

  # ===== PyPI Publish =====
  pypi:
    runs-on: ubuntu-latest
    needs: version
    permissions:
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.version.outputs.version }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # ===== GitHub Release =====
  github-release:
    runs-on: ubuntu-latest
    needs: [version, docker-manifest, pypi]
    permissions:
      contents: write

    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          body: |
            ## MUXI Runtime v${{ needs.version.outputs.version }}

            **PyPI:** `pip install muxi-runtime==${{ needs.version.outputs.version }}`

            **Docker:** `docker pull ghcr.io/muxi-ai/runtime:v${{ needs.version.outputs.version }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===== Merge Back to Develop =====
  merge-back:
    runs-on: ubuntu-latest
    needs: [version, github-release]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.MUXI_RELEASE_TOKEN }}

      - name: Merge main back to develop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin develop
          git checkout develop
          git merge --no-ff main -m "chore: merge main back to develop (v${{ needs.version.outputs.version }})"
          git push origin develop
