  # ===== GitHub Release =====
  # Base and pytorch SIFs are uploaded as GitHub Release assets (<2 GB each).
  # CUDA SIFs go to S3 only (exceed GitHub's 2 GB limit).
  github-release:
    runs-on: ubuntu-latest
    needs: [version, docker-manifest, pypi, sif-amd64, sif-arm64, sif-pytorch-amd64, sif-pytorch-arm64, sif-cuda-amd64, sif-cuda-arm64]
    permissions:
      contents: write

    steps:
      - name: Download SIF artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          pattern: sif-*
          merge-multiple: true

      - name: List SIF files
        run: ls -lh *.sif

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          files: |
            muxi-runtime-${{ needs.version.outputs.version }}-linux-amd64.sif
            muxi-runtime-${{ needs.version.outputs.version }}-linux-arm64.sif
            muxi-runtime-${{ needs.version.outputs.version }}-pytorch-linux-amd64.sif
            muxi-runtime-${{ needs.version.outputs.version }}-pytorch-linux-arm64.sif
          body: |
            ## MUXI Runtime v${{ needs.version.outputs.version }}

            **PyPI:** `pip install muxi-runtime==${{ needs.version.outputs.version }}`

            **Docker:** `docker pull ghcr.io/muxi-ai/runtime:v${{ needs.version.outputs.version }}`

            **SIF (Singularity/Apptainer):** 6 artifacts -- 3 variants x 2 platforms

            | File | Variant | Arch | Location |
            |------|---------|------|----------|
            | `muxi-runtime-${{ needs.version.outputs.version }}-linux-amd64.sif` | base | amd64 | attached |
            | `muxi-runtime-${{ needs.version.outputs.version }}-linux-arm64.sif` | base | arm64 | attached |
            | `muxi-runtime-${{ needs.version.outputs.version }}-pytorch-linux-amd64.sif` | pytorch | amd64 | attached |
            | `muxi-runtime-${{ needs.version.outputs.version }}-pytorch-linux-arm64.sif` | pytorch | arm64 | attached |
            | `muxi-runtime-${{ needs.version.outputs.version }}-cuda-linux-amd64.sif` | cuda (experimental) | amd64 | S3 |
            | `muxi-runtime-${{ needs.version.outputs.version }}-cuda-linux-arm64.sif` | cuda (experimental) | arm64 | S3 |

            CUDA SIFs exceed GitHub's 2 GB release asset limit and are distributed via S3. All 6 SIFs are also mirrored to S3.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload latest.txt to S3
        run: |
          pip install awscli
          echo "${{ needs.version.outputs.version }}" > latest.txt
          aws s3 cp latest.txt \
            "s3://${{ secrets.MUXI_S3_BUCKET }}/runtime/latest.txt" \
            --acl public-read --content-type text/plain
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MUXI_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MUXI_S3_SECRET_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.MUXI_S3_ENDPOINT }}

  # ===== Merge Back to Develop =====
  merge-back:
    runs-on: ubuntu-latest
    needs: [version, github-release]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          token: ${{ secrets.MUXI_RELEASE_TOKEN }}

      - name: Merge main back to develop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main develop
          git checkout develop
          git reset --hard origin/develop
          git merge --no-ff origin/main -m "chore: merge main back to develop (v${{ needs.version.outputs.version }}) [skip ci]"

          if ! grep -q "^## \[unreleased\]$" CHANGELOG.md; then
            python3 -c 'from pathlib import Path; path = Path("CHANGELOG.md"); text = path.read_text(); header = "# Changelog\n\n"; unreleased = "## [unreleased]\n\n"; assert text.startswith(header), "CHANGELOG.md missing expected header"; path.write_text(header + unreleased + text[len(header):])'
            git add CHANGELOG.md
          fi

          if ! git diff --cached --quiet || ! git diff --quiet; then
            git commit --amend --no-edit
          fi
          git push origin develop

  # NOTE: Git tag is created by github-release job (softprops/action-gh-release)
  # No separate tag job needed - it was causing "tag already exists" errors
