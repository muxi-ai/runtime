# MUXI Runtime Release Workflow
#
# RELEASE FLOW:
#   develop → rc (PR) → main (merge) → auto-release
#
# STEP ORDER:
#   1. version job: calculate version, commit .version + rename CHANGELOG [unreleased] → v<version>
#   2. docker-{base,pytorch,cuda}-{amd64,arm64} jobs: build + push arch-specific images (parallel)
#      pypi job: build + publish (parallel)
#   3. docker-{base,pytorch,cuda}-manifest jobs: create multi-arch manifests
#   4. sif-{base,pytorch,cuda}-{amd64,arm64} jobs: convert to SIF (6 artifacts, parallel)
#   5. github-release job: create GitHub Release + git tag + upload all 6 SIF files
#   6. merge-back job: merge main → develop, then add fresh CHANGELOG [unreleased] on develop
#
# SIF artifact matrix (3 variants x 2 platforms = 6 artifacts per release):
#   muxi-runtime-<v>-linux-amd64.sif          base    amd64   GH Release + S3
#   muxi-runtime-<v>-linux-arm64.sif          base    arm64   GH Release + S3
#   muxi-runtime-<v>-pytorch-linux-amd64.sif  pytorch amd64   GH Release + S3
#   muxi-runtime-<v>-pytorch-linux-arm64.sif  pytorch arm64   GH Release + S3
#   muxi-runtime-<v>-cuda-linux-amd64.sif     cuda    amd64   S3 only (>2 GB)
#   muxi-runtime-<v>-cuda-linux-arm64.sif     cuda    arm64   S3 only (>2 GB)
#
# Docker image tags:
#   ghcr.io/muxi-ai/runtime:v<version>           base multi-arch
#   ghcr.io/muxi-ai/runtime:latest               base multi-arch
#   ghcr.io/muxi-ai/runtime:v<version>-pytorch   pytorch multi-arch
#   ghcr.io/muxi-ai/runtime:latest-pytorch       pytorch multi-arch
#   ghcr.io/muxi-ai/runtime:v<version>-cuda      cuda multi-arch (experimental)
#   ghcr.io/muxi-ai/runtime:latest-cuda          cuda multi-arch (experimental)
#
# Tag is created by github-release (softprops/action-gh-release) AFTER
# all builds succeed, so a failed build won't leave a dangling tag.
#
# VERSION FORMAT (ScalVer):
#   MAJOR.YYYYMMDD.PATCH
#
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: muxi-ai/runtime
  APPTAINER_VERSION: "1.4.5"

jobs:
  # ===== Version Calculation & Tagging =====
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: "!startsWith(github.event.head_commit.message, 'chore: release')"
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      sha: ${{ steps.sha.outputs.SHA }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          token: ${{ secrets.MUXI_RELEASE_TOKEN }}

      - name: Calculate next version (ScalVer)
        id: version
        run: |
          CURRENT_VERSION=$(cat src/muxi/runtime/.version 2>/dev/null || echo "0.20000101.0")
          MAJOR=$(echo $CURRENT_VERSION | cut -d. -f1)
          CURRENT_DATE=$(echo $CURRENT_VERSION | cut -d. -f2)
          CURRENT_PATCH=$(echo $CURRENT_VERSION | cut -d. -f3)
          TODAY=$(date +%Y%m%d)

          if [ "$CURRENT_DATE" = "$TODAY" ]; then
            NEXT_PATCH=$((CURRENT_PATCH + 1))
            NEXT_VERSION="${MAJOR}.${TODAY}.${NEXT_PATCH}"
          else
            NEXT_VERSION="${MAJOR}.${TODAY}.0"
          fi

          echo "VERSION=$NEXT_VERSION" >> $GITHUB_OUTPUT
          echo "Current: $CURRENT_VERSION -> Next: v$NEXT_VERSION"

      - name: Update version and CHANGELOG
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"

          echo "$VERSION" > src/muxi/runtime/.version

          # Finalize top changelog section for the release.
          if grep -q "^## \[unreleased\]$" CHANGELOG.md; then
            sed -i.bak "0,/^## \[unreleased\]$/s//## v$VERSION/" CHANGELOG.md
            rm -f CHANGELOG.md.bak
          elif grep -q "^## \[Unreleased\]$" CHANGELOG.md; then
            sed -i.bak "0,/^## \[Unreleased\]$/s//## v$VERSION/" CHANGELOG.md
            rm -f CHANGELOG.md.bak
          elif grep -q "## X\.XXXXXXXX\.X" CHANGELOG.md; then
            sed -i.bak "s/## X\.XXXXXXXX\.X/## v$VERSION/" CHANGELOG.md
            rm -f CHANGELOG.md.bak
          else
            echo "::warning::No [unreleased] / [Unreleased] / X.XXXXXXXX.X placeholder found in CHANGELOG.md; skipping changelog rewrite for this release."
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/muxi/runtime/.version CHANGELOG.md

          if ! git diff --cached --quiet; then
            git commit -m "chore: release v$VERSION"
            git push
          fi

      - name: Output release commit SHA
        id: sha
        run: echo "SHA=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

  # ===== Docker Build (AMD64) - Native =====
  docker-amd64:
    runs-on: ubuntu-latest
    needs: version
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android
          df -h

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ needs.version.outputs.version }}-amd64
          platforms: linux/amd64
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64
          provenance: false
          sbom: false

  # ===== Docker Build (ARM64) - Native =====
  docker-arm64:
    runs-on: ubuntu-24.04-arm
    needs: version
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (arm64)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ needs.version.outputs.version }}-arm64
          platforms: linux/arm64
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64
          provenance: false
          sbom: false

  # ===== Docker Build PyTorch (AMD64) =====
  docker-pytorch-amd64:
    runs-on: ubuntu-latest
    needs: [version, docker-amd64]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android
          df -h

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push pytorch (amd64)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v5
        with:
          context: .
          file: ./Dockerfile.pytorch
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ needs.version.outputs.version }}-pytorch-amd64
          platforms: linux/amd64
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            BASE_TAG=v${{ needs.version.outputs.version }}-amd64
          cache-from: type=gha,scope=pytorch-amd64
          cache-to: type=gha,mode=max,scope=pytorch-amd64
          provenance: false
          sbom: false

  # ===== Docker Build PyTorch (ARM64) =====
  docker-pytorch-arm64:
    runs-on: ubuntu-24.04-arm
    needs: [version, docker-arm64]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push pytorch (arm64)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v5
        with:
          context: .
          file: ./Dockerfile.pytorch
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ needs.version.outputs.version }}-pytorch-arm64
          platforms: linux/arm64
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            BASE_TAG=v${{ needs.version.outputs.version }}-arm64
          cache-from: type=gha,scope=pytorch-arm64
          cache-to: type=gha,mode=max,scope=pytorch-arm64
          provenance: false
          sbom: false

  # ===== Docker Build CUDA (AMD64, experimental) =====
  docker-cuda-amd64:
    runs-on: ubuntu-latest
    needs: [version, docker-amd64]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android
          sudo rm -rf /usr/share/swift /usr/local/julia* /opt/hostedtoolcache
          sudo apt-get clean
          df -h

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push cuda (amd64)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v5
        with:
          context: .
          file: ./Dockerfile.cuda
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ needs.version.outputs.version }}-cuda-amd64
          platforms: linux/amd64
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            BASE_TAG=v${{ needs.version.outputs.version }}-amd64
          cache-from: type=gha,scope=cuda-amd64
          cache-to: type=gha,mode=max,scope=cuda-amd64
          provenance: false
          sbom: false

  # ===== Docker Build CUDA (ARM64, experimental) =====
  docker-cuda-arm64:
    runs-on: ubuntu-24.04-arm
    needs: [version, docker-arm64]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push cuda (arm64)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v5
        with:
          context: .
          file: ./Dockerfile.cuda
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ needs.version.outputs.version }}-cuda-arm64
          platforms: linux/arm64
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            BASE_TAG=v${{ needs.version.outputs.version }}-arm64
          cache-from: type=gha,scope=cuda-arm64
          cache-to: type=gha,mode=max,scope=cuda-arm64
          provenance: false
          sbom: false

  # ===== Create Multi-Arch Manifest (base) =====
  docker-manifest:
    runs-on: ubuntu-latest
    needs: [version, docker-amd64, docker-arm64]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Create and push manifest
        run: |
          VERSION="v${{ needs.version.outputs.version }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          docker buildx imagetools create -t ${IMAGE}:${VERSION} \
            ${IMAGE}:${VERSION}-amd64 \
            ${IMAGE}:${VERSION}-arm64

          docker buildx imagetools create -t ${IMAGE}:latest \
            ${IMAGE}:${VERSION}-amd64 \
            ${IMAGE}:${VERSION}-arm64

          echo "Created multi-arch manifests for ${VERSION} and latest"

  # ===== Create Multi-Arch Manifest (pytorch) =====
  docker-pytorch-manifest:
    runs-on: ubuntu-latest
    needs: [version, docker-pytorch-amd64, docker-pytorch-arm64]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Create and push pytorch manifest
        run: |
          VERSION="v${{ needs.version.outputs.version }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          docker buildx imagetools create -t ${IMAGE}:${VERSION}-pytorch \
            ${IMAGE}:${VERSION}-pytorch-amd64 \
            ${IMAGE}:${VERSION}-pytorch-arm64

          docker buildx imagetools create -t ${IMAGE}:latest-pytorch \
            ${IMAGE}:${VERSION}-pytorch-amd64 \
            ${IMAGE}:${VERSION}-pytorch-arm64

          echo "Created pytorch manifests for ${VERSION}-pytorch and latest-pytorch"

  # ===== Create Multi-Arch Manifest (cuda, experimental) =====
  docker-cuda-manifest:
    runs-on: ubuntu-latest
    needs: [version, docker-cuda-amd64, docker-cuda-arm64]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Create and push cuda manifest
        run: |
          VERSION="v${{ needs.version.outputs.version }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          docker buildx imagetools create -t ${IMAGE}:${VERSION}-cuda \
            ${IMAGE}:${VERSION}-cuda-amd64 \
            ${IMAGE}:${VERSION}-cuda-arm64

          docker buildx imagetools create -t ${IMAGE}:latest-cuda \
            ${IMAGE}:${VERSION}-cuda-amd64 \
            ${IMAGE}:${VERSION}-cuda-arm64

          echo "Created cuda manifests for ${VERSION}-cuda and latest-cuda"

  # ===== Re-tag base as latest (must run LAST so GHCR shows base as default) =====
  docker-retag-latest:
    runs-on: ubuntu-latest
    needs: [version, docker-manifest, docker-pytorch-manifest, docker-cuda-manifest]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Re-push base latest tag
        run: |
          VERSION="v${{ needs.version.outputs.version }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          # Re-create the latest tag so it is the most recently pushed,
          # which makes GHCR show the base image as the default package.
          docker buildx imagetools create -t ${IMAGE}:latest \
            ${IMAGE}:${VERSION}-amd64 \
            ${IMAGE}:${VERSION}-arm64

          echo "Re-tagged ${IMAGE}:latest (base) as most recent"

  # ===== PyPI Publish =====
  pypi:
    runs-on: ubuntu-latest
    needs: version
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: '3.11'

      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1

  # ===== Build SIF Images =====
  sif-amd64:
    runs-on: ubuntu-latest
    needs: [version, docker-manifest]
    permissions:
      contents: read
      packages: read

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android
          sudo rm -rf /usr/share/swift /usr/local/julia* /opt/hostedtoolcache
          sudo apt-get clean
          df -h

      - name: Install Apptainer (PPA -> pkg.muxi.org fallback)
        run: |
          set -e
          ARCH=$(dpkg --print-architecture)
          sudo apt-get update -qq
          sudo apt-get install -y -qq software-properties-common
          if sudo timeout 90 add-apt-repository -y ppa:apptainer/ppa \
             && sudo apt-get update -qq \
             && sudo apt-get install -y -qq apptainer; then
            echo "Installed apptainer via PPA"
          else
            echo "PPA path failed, falling back to pkg.muxi.org mirror"
            curl -fsSL "https://pkg.muxi.org/apptainer/v${APPTAINER_VERSION}/apptainer_${APPTAINER_VERSION}_${ARCH}.deb" \
              -o /tmp/apptainer.deb
            sudo apt-get install -y /tmp/apptainer.deb
            rm -f /tmp/apptainer.deb
          fi
          apptainer --version

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build SIF from Docker (amd64)
        run: |
          VERSION="v${{ needs.version.outputs.version }}"
          apptainer build muxi-runtime-${{ needs.version.outputs.version }}-linux-amd64.sif \
            docker://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}-amd64

      - name: Upload SIF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: sif-amd64
          path: muxi-runtime-${{ needs.version.outputs.version }}-linux-amd64.sif

      - name: Upload to S3
        run: |
          pip install awscli
          aws s3 cp --acl public-read muxi-runtime-${{ needs.version.outputs.version }}-linux-amd64.sif \
            s3://${{ secrets.MUXI_S3_BUCKET }}/runtime/${{ needs.version.outputs.version }}/muxi-runtime-${{ needs.version.outputs.version }}-linux-amd64.sif
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MUXI_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MUXI_S3_SECRET_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.MUXI_S3_ENDPOINT }}

  sif-arm64:
    runs-on: ubuntu-24.04-arm
    needs: [version, docker-manifest]
    permissions:
      contents: read
      packages: read

    steps:
      - name: Install Apptainer (PPA -> pkg.muxi.org fallback)
        run: |
          set -e
          ARCH=$(dpkg --print-architecture)
