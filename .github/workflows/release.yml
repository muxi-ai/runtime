# MUXI Runtime Release Workflow
#
# RELEASE FLOW:
#   develop → rc (PR) → main (merge) → auto-release
#
# STEP ORDER:
#   1. version job: calculate version, commit .version + CHANGELOG
#   2. docker-amd64, docker-arm64, pypi jobs: build + publish (parallel)
#   3. docker-manifest job: create multi-arch manifest
#   4. sif-amd64, sif-arm64 jobs: convert Docker images to SIF (parallel)
#   5. github-release job: create GitHub Release + git tag + upload SIF files
#   6. merge-back job: merge main → develop
#
# Tag is created by github-release (softprops/action-gh-release) AFTER
# Docker/PyPI/SIF builds succeed, so a failed build won't leave a dangling tag.
#
# VERSION FORMAT (ScalVer):
#   MAJOR.YYYYMMDD.PATCH
#
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: muxi-ai/runtime

jobs:
  # ===== Version Calculation & Tagging =====
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: "!startsWith(github.event.head_commit.message, 'chore: release')"
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      sha: ${{ steps.sha.outputs.SHA }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          token: ${{ secrets.MUXI_RELEASE_TOKEN }}

      - name: Calculate next version (ScalVer)
        id: version
        run: |
          CURRENT_VERSION=$(cat src/muxi/runtime/.version 2>/dev/null || echo "0.20000101.0")
          MAJOR=$(echo $CURRENT_VERSION | cut -d. -f1)
          CURRENT_DATE=$(echo $CURRENT_VERSION | cut -d. -f2)
          CURRENT_PATCH=$(echo $CURRENT_VERSION | cut -d. -f3)
          TODAY=$(date +%Y%m%d)

          if [ "$CURRENT_DATE" = "$TODAY" ]; then
            NEXT_PATCH=$((CURRENT_PATCH + 1))
            NEXT_VERSION="${MAJOR}.${TODAY}.${NEXT_PATCH}"
          else
            NEXT_VERSION="${MAJOR}.${TODAY}.0"
          fi

          echo "VERSION=$NEXT_VERSION" >> $GITHUB_OUTPUT
          echo "Current: $CURRENT_VERSION -> Next: v$NEXT_VERSION"

      - name: Update version and CHANGELOG
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          TODAY=$(date +%Y-%m-%d)

          echo "$VERSION" > src/muxi/runtime/.version

          # Update CHANGELOG - handle both [Unreleased] and X.XXXXXXXX.X placeholders
          if grep -q "## \[Unreleased\]" CHANGELOG.md; then
            sed -i.bak "s/## \[Unreleased\]/## [$VERSION] - $TODAY/" CHANGELOG.md
            rm -f CHANGELOG.md.bak
          elif grep -q "## X\.XXXXXXXX\.X" CHANGELOG.md; then
            sed -i.bak "s/## X\.XXXXXXXX\.X/## $VERSION/" CHANGELOG.md
            rm -f CHANGELOG.md.bak
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/muxi/runtime/.version CHANGELOG.md

          if ! git diff --cached --quiet; then
            git commit -m "chore: release v$VERSION"
            git push
          fi

      - name: Output release commit SHA
        id: sha
        run: echo "SHA=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

  # ===== Docker Build (AMD64) - Native =====
  docker-amd64:
    runs-on: ubuntu-latest
    needs: version
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android
          df -h

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64)
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ needs.version.outputs.version }}-amd64
          platforms: linux/amd64
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64
          provenance: false
          sbom: false

  # ===== Docker Build (ARM64) - Native =====
  docker-arm64:
    runs-on: ubuntu-24.04-arm
    needs: version
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (arm64)
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ needs.version.outputs.version }}-arm64
          platforms: linux/arm64
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64
          provenance: false
          sbom: false

  # ===== Create Multi-Arch Manifest =====
  docker-manifest:
    runs-on: ubuntu-latest
    needs: [version, docker-amd64, docker-arm64]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Create and push manifest
        run: |
          VERSION="v${{ needs.version.outputs.version }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          docker buildx imagetools create -t ${IMAGE}:${VERSION} \
            ${IMAGE}:${VERSION}-amd64 \
            ${IMAGE}:${VERSION}-arm64

          docker buildx imagetools create -t ${IMAGE}:latest \
            ${IMAGE}:${VERSION}-amd64 \
            ${IMAGE}:${VERSION}-arm64

          echo "Created multi-arch manifests for ${VERSION} and latest"

  # ===== PyPI Publish =====
  pypi:
    runs-on: ubuntu-latest
    needs: version
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v5
        with:
          python-version: '3.11'

      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # release/v1

  # ===== Build SIF Images =====
  sif-amd64:
    runs-on: ubuntu-latest
    needs: [version, docker-manifest]
    permissions:
      contents: read
      packages: read

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android
          sudo rm -rf /usr/share/swift /usr/local/julia* /opt/hostedtoolcache
          sudo apt-get clean
          df -h

      - name: Install Apptainer
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update
          sudo apt-get install -y apptainer

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build SIF from Docker (amd64)
        run: |
          VERSION="v${{ needs.version.outputs.version }}"
          apptainer build muxi-runtime-${{ needs.version.outputs.version }}-linux-amd64.sif \
            docker://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}-amd64

      - name: Upload SIF artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v4
        with:
          name: sif-amd64
          path: muxi-runtime-${{ needs.version.outputs.version }}-linux-amd64.sif

  sif-arm64:
    runs-on: ubuntu-24.04-arm
    needs: [version, docker-manifest]
    permissions:
      contents: read
      packages: read

    steps:
      - name: Install Apptainer
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update
          sudo apt-get install -y apptainer

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build SIF from Docker (arm64)
        run: |
          VERSION="v${{ needs.version.outputs.version }}"
          apptainer build muxi-runtime-${{ needs.version.outputs.version }}-linux-arm64.sif \
            docker://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}-arm64

      - name: Upload SIF artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v4
        with:
          name: sif-arm64
          path: muxi-runtime-${{ needs.version.outputs.version }}-linux-arm64.sif

  # ===== GitHub Release =====
  github-release:
    runs-on: ubuntu-latest
    needs: [version, docker-manifest, pypi, sif-amd64, sif-arm64]
    permissions:
      contents: write

    steps:
      - name: Download SIF artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          pattern: sif-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          files: |
            muxi-runtime-${{ needs.version.outputs.version }}-linux-amd64.sif
            muxi-runtime-${{ needs.version.outputs.version }}-linux-arm64.sif
          body: |
            ## MUXI Runtime v${{ needs.version.outputs.version }}

            **PyPI:** `pip install muxi-runtime==${{ needs.version.outputs.version }}`

            **Docker:** `docker pull ghcr.io/muxi-ai/runtime:v${{ needs.version.outputs.version }}`

            **SIF (Singularity/Apptainer):**
            - `muxi-runtime-${{ needs.version.outputs.version }}-linux-amd64.sif`
            - `muxi-runtime-${{ needs.version.outputs.version }}-linux-arm64.sif`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===== Merge Back to Develop =====
  merge-back:
    runs-on: ubuntu-latest
    needs: [version, github-release]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          token: ${{ secrets.MUXI_RELEASE_TOKEN }}

      - name: Merge main back to develop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin develop
          git checkout develop
          git merge --no-ff main -m "chore: merge main back to develop (v${{ needs.version.outputs.version }}) [skip ci]"
          git push origin develop

  # NOTE: Git tag is created by github-release job (softprops/action-gh-release)
  # No separate tag job needed - it was causing "tag already exists" errors
