#
# RELEASE DRY RUN
#
# Mirrors release.yml but:
#   - Manual trigger only (workflow_dispatch)
#   - No CHANGELOG / .version commit, no git push
#   - No PyPI publish
#   - No GitHub Release / git tag
#   - No merge-back to develop
#   - No retagging of :latest / :latest-pytorch / :latest-cuda
#
# Image tags get a "-dryrun.<run_id>" suffix so test artifacts cannot
# collide with real releases. SIFs upload to s3://.../runtime-dryrun/...
# instead of s3://.../runtime/... for the same reason.
#
# Apptainer install uses a PPA -> pkg.muxi.org fallback so we can validate
# the mirror path is healthy before relying on it in the real release flow.
#
# This workflow exists so the SIF build pipeline can be exercised end-to-end
# without cutting an actual release.
#
name: Release (Dry Run)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch / tag / SHA to build (default: current branch)"
        required: false
        default: ""

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: muxi-ai/runtime
  APPTAINER_VERSION: "1.4.5"

jobs:
  # ===== Version Calculation (no commit, no push) =====
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      sha: ${{ steps.sha.outputs.SHA }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Calculate dryrun version
        id: version
        run: |
          CURRENT_VERSION=$(cat src/muxi/runtime/.version 2>/dev/null || echo "0.20000101.0")
          MAJOR=$(echo "$CURRENT_VERSION" | cut -d. -f1)
          TODAY=$(date +%Y%m%d)
          DRYRUN_VERSION="${MAJOR}.${TODAY}.0-dryrun.${{ github.run_id }}"
          echo "VERSION=$DRYRUN_VERSION" >> "$GITHUB_OUTPUT"
          echo "Dryrun version: v$DRYRUN_VERSION"

      - name: Output build SHA
        id: sha
        run: echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # ===== Docker Build (AMD64) =====
  docker-amd64:
    runs-on: ubuntu-latest
    needs: version
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android
          df -h

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ needs.version.outputs.version }}-amd64
          platforms: linux/amd64
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64
          provenance: false
          sbom: false

  # ===== Docker Build (ARM64) =====
  docker-arm64:
    runs-on: ubuntu-24.04-arm
    needs: version
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (arm64)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ needs.version.outputs.version }}-arm64
          platforms: linux/arm64
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64
          provenance: false
          sbom: false

  # ===== Docker Build PyTorch (AMD64) =====
  docker-pytorch-amd64:
    runs-on: ubuntu-latest
    needs: [version, docker-amd64]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android
          df -h

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push pytorch (amd64)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v5
        with:
          context: .
          file: ./Dockerfile.pytorch
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ needs.version.outputs.version }}-pytorch-amd64
          platforms: linux/amd64
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            BASE_TAG=v${{ needs.version.outputs.version }}-amd64
          cache-from: type=gha,scope=pytorch-amd64
          cache-to: type=gha,mode=max,scope=pytorch-amd64
          provenance: false
          sbom: false

  # ===== Docker Build PyTorch (ARM64) =====
  docker-pytorch-arm64:
    runs-on: ubuntu-24.04-arm
    needs: [version, docker-arm64]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push pytorch (arm64)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v5
        with:
          context: .
          file: ./Dockerfile.pytorch
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ needs.version.outputs.version }}-pytorch-arm64
          platforms: linux/arm64
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            BASE_TAG=v${{ needs.version.outputs.version }}-arm64
          cache-from: type=gha,scope=pytorch-arm64
          cache-to: type=gha,mode=max,scope=pytorch-arm64
          provenance: false
          sbom: false

  # ===== Docker Build CUDA (AMD64) =====
  docker-cuda-amd64:
    runs-on: ubuntu-latest
    needs: [version, docker-amd64]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android
          sudo rm -rf /usr/share/swift /usr/local/julia* /opt/hostedtoolcache
          sudo apt-get clean
          df -h

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push cuda (amd64)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v5
        with:
          context: .
          file: ./Dockerfile.cuda
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ needs.version.outputs.version }}-cuda-amd64
          platforms: linux/amd64
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            BASE_TAG=v${{ needs.version.outputs.version }}-amd64
          cache-from: type=gha,scope=cuda-amd64
          cache-to: type=gha,mode=max,scope=cuda-amd64
          provenance: false
          sbom: false

  # ===== Docker Build CUDA (ARM64) =====
  docker-cuda-arm64:
    runs-on: ubuntu-24.04-arm
    needs: [version, docker-arm64]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push cuda (arm64)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v5
        with:
          context: .
          file: ./Dockerfile.cuda
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ needs.version.outputs.version }}-cuda-arm64
          platforms: linux/arm64
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            BASE_TAG=v${{ needs.version.outputs.version }}-arm64
          cache-from: type=gha,scope=cuda-arm64
          cache-to: type=gha,mode=max,scope=cuda-arm64
          provenance: false
          sbom: false

  # ===== Multi-Arch Manifests (no :latest tagging in dryrun) =====
  docker-manifest:
    runs-on: ubuntu-latest
    needs: [version, docker-amd64, docker-arm64]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Create base manifest
        run: |
          VERSION="v${{ needs.version.outputs.version }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          docker buildx imagetools create -t ${IMAGE}:${VERSION} \
            ${IMAGE}:${VERSION}-amd64 \
            ${IMAGE}:${VERSION}-arm64

  docker-pytorch-manifest:
    runs-on: ubuntu-latest
    needs: [version, docker-pytorch-amd64, docker-pytorch-arm64]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Create pytorch manifest
        run: |
          VERSION="v${{ needs.version.outputs.version }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          docker buildx imagetools create -t ${IMAGE}:${VERSION}-pytorch \
            ${IMAGE}:${VERSION}-pytorch-amd64 \
            ${IMAGE}:${VERSION}-pytorch-arm64

  docker-cuda-manifest:
    runs-on: ubuntu-latest
    needs: [version, docker-cuda-amd64, docker-cuda-arm64]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Create cuda manifest
        run: |
          VERSION="v${{ needs.version.outputs.version }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          docker buildx imagetools create -t ${IMAGE}:${VERSION}-cuda \
            ${IMAGE}:${VERSION}-cuda-amd64 \
            ${IMAGE}:${VERSION}-cuda-arm64

  # ===== Build SIF Images =====
  sif-amd64:
    runs-on: ubuntu-latest
    needs: [version, docker-manifest]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android
          sudo rm -rf /usr/share/swift /usr/local/julia* /opt/hostedtoolcache
          sudo apt-get clean
          df -h

      - name: Install Apptainer (PPA -> pkg.muxi.org fallback)
        run: |
          set -e
          ARCH=$(dpkg --print-architecture)
          sudo apt-get update -qq
          sudo apt-get install -y -qq software-properties-common
          if sudo timeout 90 add-apt-repository -y ppa:apptainer/ppa \
             && sudo apt-get update -qq \
             && sudo apt-get install -y -qq apptainer; then
            echo "Installed apptainer via PPA"
          else
            echo "PPA path failed, falling back to pkg.muxi.org mirror"
            curl -fsSL "https://pkg.muxi.org/apptainer/v${APPTAINER_VERSION}/apptainer_${APPTAINER_VERSION}_${ARCH}.deb" \
              -o /tmp/apptainer.deb
            sudo apt-get install -y /tmp/apptainer.deb
            rm -f /tmp/apptainer.deb
          fi
          apptainer --version

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build SIF from Docker (amd64)
        run: |
          VERSION="v${{ needs.version.outputs.version }}"
          apptainer build muxi-runtime-${{ needs.version.outputs.version }}-linux-amd64.sif \
            docker://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}-amd64

      - name: Upload SIF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: sif-amd64
          path: muxi-runtime-${{ needs.version.outputs.version }}-linux-amd64.sif

      - name: Upload to S3 (dryrun bucket prefix)
        run: |
          pip install awscli
          aws s3 cp --acl public-read muxi-runtime-${{ needs.version.outputs.version }}-linux-amd64.sif \
            s3://${{ secrets.MUXI_S3_BUCKET }}/runtime-dryrun/${{ needs.version.outputs.version }}/muxi-runtime-${{ needs.version.outputs.version }}-linux-amd64.sif
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MUXI_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MUXI_S3_SECRET_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.MUXI_S3_ENDPOINT }}

  sif-arm64:
    runs-on: ubuntu-24.04-arm
    needs: [version, docker-manifest]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Install Apptainer (PPA -> pkg.muxi.org fallback)
        run: |
          set -e
          ARCH=$(dpkg --print-architecture)
          sudo apt-get update -qq
          sudo apt-get install -y -qq software-properties-common
          if sudo timeout 90 add-apt-repository -y ppa:apptainer/ppa \
             && sudo apt-get update -qq \
             && sudo apt-get install -y -qq apptainer; then
            echo "Installed apptainer via PPA"
          else
            echo "PPA path failed, falling back to pkg.muxi.org mirror"
            curl -fsSL "https://pkg.muxi.org/apptainer/v${APPTAINER_VERSION}/apptainer_${APPTAINER_VERSION}_${ARCH}.deb" \
              -o /tmp/apptainer.deb
            sudo apt-get install -y /tmp/apptainer.deb
            rm -f /tmp/apptainer.deb
          fi
          apptainer --version

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build SIF from Docker (arm64)
        run: |
          VERSION="v${{ needs.version.outputs.version }}"
          apptainer build muxi-runtime-${{ needs.version.outputs.version }}-linux-arm64.sif \
            docker://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}-arm64

      - name: Upload SIF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: sif-arm64
          path: muxi-runtime-${{ needs.version.outputs.version }}-linux-arm64.sif

      - name: Upload to S3 (dryrun bucket prefix)
        run: |
          pip install awscli
          aws s3 cp --acl public-read muxi-runtime-${{ needs.version.outputs.version }}-linux-arm64.sif \
            s3://${{ secrets.MUXI_S3_BUCKET }}/runtime-dryrun/${{ needs.version.outputs.version }}/muxi-runtime-${{ needs.version.outputs.version }}-linux-arm64.sif
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MUXI_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MUXI_S3_SECRET_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.MUXI_S3_ENDPOINT }}

  sif-pytorch-amd64:
    runs-on: ubuntu-latest
    needs: [version, docker-pytorch-manifest]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android
          sudo rm -rf /usr/share/swift /usr/local/julia* /opt/hostedtoolcache
          sudo apt-get clean
          df -h

      - name: Install Apptainer (PPA -> pkg.muxi.org fallback)
        run: |
          set -e
          ARCH=$(dpkg --print-architecture)
          sudo apt-get update -qq
          sudo apt-get install -y -qq software-properties-common
          if sudo timeout 90 add-apt-repository -y ppa:apptainer/ppa \
             && sudo apt-get update -qq \
             && sudo apt-get install -y -qq apptainer; then
            echo "Installed apptainer via PPA"
          else
            echo "PPA path failed, falling back to pkg.muxi.org mirror"
            curl -fsSL "https://pkg.muxi.org/apptainer/v${APPTAINER_VERSION}/apptainer_${APPTAINER_VERSION}_${ARCH}.deb" \
              -o /tmp/apptainer.deb
            sudo apt-get install -y /tmp/apptainer.deb
            rm -f /tmp/apptainer.deb
          fi
          apptainer --version

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build SIF from Docker (pytorch amd64)
        run: |
          VERSION="v${{ needs.version.outputs.version }}"
          apptainer build muxi-runtime-${{ needs.version.outputs.version }}-pytorch-linux-amd64.sif \
            docker://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}-pytorch-amd64

      - name: Upload SIF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: sif-pytorch-amd64
          path: muxi-runtime-${{ needs.version.outputs.version }}-pytorch-linux-amd64.sif

      - name: Upload to S3 (dryrun bucket prefix)
        run: |
          pip install awscli
          aws s3 cp --acl public-read muxi-runtime-${{ needs.version.outputs.version }}-pytorch-linux-amd64.sif \
            s3://${{ secrets.MUXI_S3_BUCKET }}/runtime-dryrun/${{ needs.version.outputs.version }}/muxi-runtime-${{ needs.version.outputs.version }}-pytorch-linux-amd64.sif
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MUXI_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MUXI_S3_SECRET_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.MUXI_S3_ENDPOINT }}

  sif-pytorch-arm64:
    runs-on: ubuntu-24.04-arm
    needs: [version, docker-pytorch-manifest]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Install Apptainer (PPA -> pkg.muxi.org fallback)
        run: |
          set -e
          ARCH=$(dpkg --print-architecture)
          sudo apt-get update -qq
          sudo apt-get install -y -qq software-properties-common
          if sudo timeout 90 add-apt-repository -y ppa:apptainer/ppa \
             && sudo apt-get update -qq \
             && sudo apt-get install -y -qq apptainer; then
            echo "Installed apptainer via PPA"
          else
            echo "PPA path failed, falling back to pkg.muxi.org mirror"
            curl -fsSL "https://pkg.muxi.org/apptainer/v${APPTAINER_VERSION}/apptainer_${APPTAINER_VERSION}_${ARCH}.deb" \
              -o /tmp/apptainer.deb
            sudo apt-get install -y /tmp/apptainer.deb
            rm -f /tmp/apptainer.deb
          fi
          apptainer --version

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build SIF from Docker (pytorch arm64)
        run: |
          VERSION="v${{ needs.version.outputs.version }}"
          apptainer build muxi-runtime-${{ needs.version.outputs.version }}-pytorch-linux-arm64.sif \
            docker://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}-pytorch-arm64

      - name: Upload SIF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: sif-pytorch-arm64
          path: muxi-runtime-${{ needs.version.outputs.version }}-pytorch-linux-arm64.sif

      - name: Upload to S3 (dryrun bucket prefix)
        run: |
          pip install awscli
          aws s3 cp --acl public-read muxi-runtime-${{ needs.version.outputs.version }}-pytorch-linux-arm64.sif \
            s3://${{ secrets.MUXI_S3_BUCKET }}/runtime-dryrun/${{ needs.version.outputs.version }}/muxi-runtime-${{ needs.version.outputs.version }}-pytorch-linux-arm64.sif
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MUXI_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MUXI_S3_SECRET_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.MUXI_S3_ENDPOINT }}

  sif-cuda-amd64:
    runs-on: ubuntu-latest
    needs: [version, docker-cuda-manifest]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android
          sudo rm -rf /usr/share/swift /usr/local/julia* /opt/hostedtoolcache
          sudo apt-get clean
          df -h

      - name: Install Apptainer (PPA -> pkg.muxi.org fallback)
        run: |
          set -e
          ARCH=$(dpkg --print-architecture)
          sudo apt-get update -qq
          sudo apt-get install -y -qq software-properties-common
          if sudo timeout 90 add-apt-repository -y ppa:apptainer/ppa \
             && sudo apt-get update -qq \
             && sudo apt-get install -y -qq apptainer; then
            echo "Installed apptainer via PPA"
          else
            echo "PPA path failed, falling back to pkg.muxi.org mirror"
            curl -fsSL "https://pkg.muxi.org/apptainer/v${APPTAINER_VERSION}/apptainer_${APPTAINER_VERSION}_${ARCH}.deb" \
              -o /tmp/apptainer.deb
            sudo apt-get install -y /tmp/apptainer.deb
            rm -f /tmp/apptainer.deb
          fi
          apptainer --version

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build SIF from Docker (cuda amd64)
        run: |
          VERSION="v${{ needs.version.outputs.version }}"
          apptainer build muxi-runtime-${{ needs.version.outputs.version }}-cuda-linux-amd64.sif \
            docker://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}-cuda-amd64
          ls -lh *.sif

      - name: Upload to S3 (dryrun bucket prefix)
        run: |
          pip install awscli
          aws s3 cp --acl public-read muxi-runtime-${{ needs.version.outputs.version }}-cuda-linux-amd64.sif \
            s3://${{ secrets.MUXI_S3_BUCKET }}/runtime-dryrun/${{ needs.version.outputs.version }}/muxi-runtime-${{ needs.version.outputs.version }}-cuda-linux-amd64.sif
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MUXI_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MUXI_S3_SECRET_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.MUXI_S3_ENDPOINT }}

  sif-cuda-arm64:
    runs-on: ubuntu-24.04-arm
    needs: [version, docker-cuda-manifest]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Install Apptainer (PPA -> pkg.muxi.org fallback)
        run: |
          set -e
          ARCH=$(dpkg --print-architecture)
          sudo apt-get update -qq
          sudo apt-get install -y -qq software-properties-common
          if sudo timeout 90 add-apt-repository -y ppa:apptainer/ppa \
             && sudo apt-get update -qq \
             && sudo apt-get install -y -qq apptainer; then
            echo "Installed apptainer via PPA"
          else
            echo "PPA path failed, falling back to pkg.muxi.org mirror"
            curl -fsSL "https://pkg.muxi.org/apptainer/v${APPTAINER_VERSION}/apptainer_${APPTAINER_VERSION}_${ARCH}.deb" \
              -o /tmp/apptainer.deb
            sudo apt-get install -y /tmp/apptainer.deb
            rm -f /tmp/apptainer.deb
          fi
          apptainer --version

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build SIF from Docker (cuda arm64)
        run: |
          VERSION="v${{ needs.version.outputs.version }}"
          apptainer build muxi-runtime-${{ needs.version.outputs.version }}-cuda-linux-arm64.sif \
            docker://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}-cuda-arm64
          ls -lh *.sif

      - name: Upload to S3 (dryrun bucket prefix)
        run: |
          pip install awscli
          aws s3 cp --acl public-read muxi-runtime-${{ needs.version.outputs.version }}-cuda-linux-arm64.sif \
            s3://${{ secrets.MUXI_S3_BUCKET }}/runtime-dryrun/${{ needs.version.outputs.version }}/muxi-runtime-${{ needs.version.outputs.version }}-cuda-linux-arm64.sif
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MUXI_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MUXI_S3_SECRET_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.MUXI_S3_ENDPOINT }}

  # ===== Summary =====
  summary:
    runs-on: ubuntu-latest
    needs:
      - version
      - sif-amd64
      - sif-arm64
      - sif-pytorch-amd64
      - sif-pytorch-arm64
      - sif-cuda-amd64
      - sif-cuda-arm64
    if: always()
    steps:
      - name: Print summary
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          {
            echo "## Dry run completed"
            echo ""
            echo "**Version:** \`v${VERSION}\`"
            echo ""
            echo "**Docker images (GHCR):**"
            echo "- ghcr.io/muxi-ai/runtime:v${VERSION}"
            echo "- ghcr.io/muxi-ai/runtime:v${VERSION}-pytorch"
            echo "- ghcr.io/muxi-ai/runtime:v${VERSION}-cuda"
            echo ""
            echo "**SIFs (S3):** \`s3://\$BUCKET/runtime-dryrun/${VERSION}/*.sif\` (6 files)"
            echo ""
            echo "Nothing was committed, tagged, published to PyPI, or released."
          } >> "$GITHUB_STEP_SUMMARY"
