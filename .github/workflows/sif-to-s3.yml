          AWS_ENDPOINT_URL: ${{ secrets.MUXI_S3_ENDPOINT }}

  # ===== Summary =====
  summary:
    runs-on: ubuntu-latest
    if: always()
    needs: [sif-base-amd64, sif-base-arm64, sif-pytorch-amd64, sif-pytorch-arm64, sif-cuda-amd64, sif-cuda-arm64]
    steps:
      - name: Report
        run: |
          echo "SIF to S3 — version ${{ inputs.version }}, variants: ${{ inputs.variants }}"
          echo ""
          echo "S3 path: s3://<bucket>/runtime/${{ inputs.version }}/"
          echo ""
          echo "Job results:"
          echo "  base-amd64:    ${{ needs.sif-base-amd64.result }}"
          echo "  base-arm64:    ${{ needs.sif-base-arm64.result }}"
          echo "  pytorch-amd64: ${{ needs.sif-pytorch-amd64.result }}"
          echo "  pytorch-arm64: ${{ needs.sif-pytorch-arm64.result }}"
          echo "  cuda-amd64:    ${{ needs.sif-cuda-amd64.result }}"
          echo "  cuda-arm64:    ${{ needs.sif-cuda-arm64.result }}"
