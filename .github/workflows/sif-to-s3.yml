# Build SIF artifacts from existing GHCR Docker images and upload to S3.
#
# Manual trigger only. Converts Docker images already pushed to GHCR
# into SIF files and uploads them to s3://<bucket>/runtime/<version>/.
#
# This workflow does NOT build Docker images or bump versions — it
# assumes the images already exist in GHCR from a prior release run.
#
# Use case: testing SIF→S3 pipeline, or re-uploading SIFs for a
# version whose Docker images are already published.
#
name: SIF to S3

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Runtime version (e.g. 0.20260423.5) — Docker images must already exist on GHCR'
        required: true
        type: string
      variants:
        description: 'Which variants to build'
        required: true
        type: choice
        options:
          - all
          - base
          - pytorch
          - cuda
        default: all

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: muxi-ai/runtime
  APPTAINER_VERSION: "1.4.5"

jobs:
  # ===== Base SIF (amd64) =====
  sif-base-amd64:
    if: ${{ inputs.variants == 'all' || inputs.variants == 'base' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android
          sudo rm -rf /usr/share/swift /usr/local/julia* /opt/hostedtoolcache
          sudo apt-get clean
          df -h

      - name: Install Apptainer (PPA -> pkg.muxi.org fallback)
        run: |
          set -e
          ARCH=$(dpkg --print-architecture)
          sudo apt-get update -qq
          sudo apt-get install -y -qq software-properties-common
          if sudo timeout 90 add-apt-repository -y ppa:apptainer/ppa \
             && sudo apt-get update -qq \
             && sudo apt-get install -y -qq apptainer; then
            echo "Installed apptainer via PPA"
          else
            echo "PPA path failed, falling back to pkg.muxi.org mirror"
            curl -fsSL "https://pkg.muxi.org/apptainer/v${APPTAINER_VERSION}/apptainer_${APPTAINER_VERSION}_${ARCH}.deb" \
              -o /tmp/apptainer.deb
            sudo apt-get install -y /tmp/apptainer.deb
            rm -f /tmp/apptainer.deb
          fi
          apptainer --version

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build SIF
        run: |
          apptainer build muxi-runtime-${{ inputs.version }}-linux-amd64.sif \
            docker://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ inputs.version }}-amd64
          ls -lh *.sif

      - name: Upload to S3
        run: |
          pip install awscli
          aws s3 cp --acl public-read muxi-runtime-${{ inputs.version }}-linux-amd64.sif \
            s3://${{ secrets.MUXI_S3_BUCKET }}/runtime/${{ inputs.version }}/muxi-runtime-${{ inputs.version }}-linux-amd64.sif
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MUXI_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MUXI_S3_SECRET_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.MUXI_S3_ENDPOINT }}

  # ===== Base SIF (arm64) =====
  sif-base-arm64:
    if: ${{ inputs.variants == 'all' || inputs.variants == 'base' }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
