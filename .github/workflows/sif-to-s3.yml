          pip install awscli
          aws s3 cp --acl public-read muxi-runtime-${{ inputs.version }}-cuda-linux-amd64.sif \
            s3://${{ secrets.MUXI_S3_BUCKET }}/runtime/${{ inputs.version }}/muxi-runtime-${{ inputs.version }}-cuda-linux-amd64.sif
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MUXI_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MUXI_S3_SECRET_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.MUXI_S3_ENDPOINT }}

  # ===== CUDA SIF (arm64, experimental) =====
