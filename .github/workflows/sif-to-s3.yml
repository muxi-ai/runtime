          ls -lh *.sif

      - name: Upload to S3
        run: |
          pip install awscli
          aws s3 cp --acl public-read muxi-runtime-${{ inputs.version }}-pytorch-linux-arm64.sif \
            s3://${{ secrets.MUXI_S3_BUCKET }}/runtime/${{ inputs.version }}/muxi-runtime-${{ inputs.version }}-pytorch-linux-arm64.sif
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MUXI_S3_ACCESS_KEY }}
