          sudo rm -rf /usr/share/swift /usr/local/julia* /opt/hostedtoolcache
          sudo apt-get clean
          df -h

      - name: Install Apptainer (PPA -> pkg.muxi.org fallback)
        run: |
          set -e
          ARCH=$(dpkg --print-architecture)
          sudo apt-get update -qq
          sudo apt-get install -y -qq software-properties-common
          if sudo timeout 90 add-apt-repository -y ppa:apptainer/ppa \
             && sudo apt-get update -qq \
             && sudo apt-get install -y -qq apptainer; then
            echo "Installed apptainer via PPA"
          else
            echo "PPA path failed, falling back to pkg.muxi.org mirror"
            curl -fsSL "https://pkg.muxi.org/apptainer/v${APPTAINER_VERSION}/apptainer_${APPTAINER_VERSION}_${ARCH}.deb" \
              -o /tmp/apptainer.deb
            sudo apt-get install -y /tmp/apptainer.deb
            rm -f /tmp/apptainer.deb
          fi
          apptainer --version

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build SIF
        run: |
          apptainer build muxi-runtime-${{ inputs.version }}-pytorch-linux-amd64.sif \
            docker://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ inputs.version }}-pytorch-amd64
          ls -lh *.sif

      - name: Upload to S3
        run: |
          pip install awscli
          aws s3 cp --acl public-read muxi-runtime-${{ inputs.version }}-pytorch-linux-amd64.sif \
            s3://${{ secrets.MUXI_S3_BUCKET }}/runtime/${{ inputs.version }}/muxi-runtime-${{ inputs.version }}-pytorch-linux-amd64.sif
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MUXI_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MUXI_S3_SECRET_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.MUXI_S3_ENDPOINT }}

  # ===== PyTorch SIF (arm64) =====
  sif-pytorch-arm64:
    if: ${{ inputs.variants == 'all' || inputs.variants == 'pytorch' }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
