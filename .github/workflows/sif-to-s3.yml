      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build SIF
        run: |
          apptainer build muxi-runtime-${{ inputs.version }}-linux-arm64.sif \
            docker://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ inputs.version }}-arm64
