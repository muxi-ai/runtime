name: RC - Build & Test

on:
  push:
    branches: [rc]

permissions:
  contents: read

jobs:
  test-matrix:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    env:
      # Download HF models via the authenticated Xet client. The hf_xet
      # client + HF_TOKEN handles the CAS bridge correctly and fast;
      # disabling Xet (or removing hf_xet) forces a plain-HTTP GET of the
      # Xet presigned URL, which 403s. Cache models under HF_HOME so the
      # download happens once and is reused across runs.
      HF_HOME: ${{ github.workspace }}/.hf-cache
      HF_TOKEN: ${{ secrets.MUXI_HF_TOKEN }}

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          df -h

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Cache HuggingFace models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.HF_HOME }}
          key: hf-models-${{ runner.os }}-e5small-nomic-v3

      - name: Prewarm classifier model
        run: python scripts/prewarm_classifier.py

      - name: Run unit tests
        run: |
          pytest tests/unit -v --tb=short

      - name: Run integration tests
        run: |
          if [ -n "$(find tests/integration -name 'test_*.py' 2>/dev/null)" ]; then
            pytest tests/integration -v --tb=short
          else
            echo "No integration tests found, skipping"
          fi
        continue-on-error: true

  build-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build base Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: muxi-runtime:test
          no-cache: true

      - name: Test base Docker image
        run: |
          docker run --rm --entrypoint python muxi-runtime:test -c "from muxi.runtime import __version__; print(f'MUXI Runtime v{__version__}')"

      - name: Build pytorch Docker image
        run: |
          docker build \
            --file ./Dockerfile.pytorch \
            --build-arg BASE_IMAGE=muxi-runtime \
            --build-arg BASE_TAG=test \
            --tag muxi-runtime:test-pytorch \
            .

      - name: Test pytorch Docker image
        run: |
          docker run --rm --entrypoint python muxi-runtime:test-pytorch -c "
          from muxi.runtime import __version__
          import torch, sentence_transformers
          print(f'MUXI Runtime v{__version__} (pytorch {torch.__version__})')
          "

  build-pip:
    runs-on: ubuntu-latest
    needs: test-matrix
    permissions:
      contents: read

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Verify package
        run: |
          pip install --no-deps dist/*.whl
          pip show muxi-runtime
          unzip -l dist/*.whl | grep -E "(muxi/runtime/__init__|\.version)"

  summary:
    needs: [test-matrix, build-docker, build-pip]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: RC Build Summary
        run: |
          echo "RC Build Complete!"
          echo ""
          echo "All checks passed:"
          echo "  - Python 3.10 tests"
          echo "  - Python 3.11 tests"
          echo "  - Python 3.12 tests"
          echo "  - Docker build"
          echo "  - PyPI package build"
          echo ""
          echo "Ready to merge to main for release!"
