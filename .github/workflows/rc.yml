name: RC - Build & Test

on:
  push:
    branches: [rc]

jobs:
  test-matrix:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: |
          pytest tests/unit -v --tb=short

      - name: Run integration tests
        run: |
          if [ -n "$(find tests/integration -name 'test_*.py' 2>/dev/null)" ]; then
            pytest tests/integration -v --tb=short
          else
            echo "No integration tests found, skipping"
          fi
        continue-on-error: true

  build-docker:
    runs-on: ubuntu-latest
    needs: test-matrix

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get version
        id: version
        run: |
          VERSION=$(cat src/muxi/runtime/.version)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building Docker image for version: $VERSION"

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: |
            ghcr.io/muxi-ai/runtime:rc-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          docker build -t muxi-runtime:test .
          docker run --rm muxi-runtime:test python -c "import muxi; print(f'MUXI Runtime v{muxi.__version__}')"

  build-pip:
    runs-on: ubuntu-latest
    needs: test-matrix

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Verify package
        run: |
          pip install --no-deps dist/*.whl
          pip show muxi-runtime
          # Verify wheel contains expected files
          unzip -l dist/*.whl | grep -E "(muxi/runtime/__init__|\.version)"

  summary:
    needs: [test-matrix, build-docker, build-pip]
    runs-on: ubuntu-latest

    steps:
      - name: RC Build Summary
        run: |
          echo "🎉 RC Build Complete!"
          echo ""
          echo "All checks passed:"
          echo "  ✓ Python 3.10 tests"
          echo "  ✓ Python 3.11 tests"
          echo "  ✓ Python 3.12 tests"
          echo "  ✓ Docker build"
          echo "  ✓ PyPI package build"
          echo ""
          echo "Ready to merge to main for release!"
