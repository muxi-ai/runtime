name: RC - Build & Test

on:
  push:
    branches: [rc]

jobs:
  test-matrix:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: |
          pytest tests/unit -v --tb=short

      - name: Run integration tests
        run: |
          pytest tests/integration -v --tb=short
        continue-on-error: true

  build-docker:
    runs-on: ubuntu-latest
    needs: test-matrix

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get version
        id: version
        run: |
          VERSION=$(cat src/muxi/runtime/.version)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building Docker image for version: $VERSION"

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: |
            ghcr.io/muxi-ai/runtime:rc-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          docker build -t muxi-runtime:test .
          docker run --rm muxi-runtime:test python -c "import muxi; print(f'MUXI Runtime v{muxi.__version__}')"

  build-pip:
    runs-on: ubuntu-latest
    needs: test-matrix

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Test package install
        run: |
          pip install dist/*.whl
          python -c "import muxi; print(f'MUXI Runtime v{muxi.__version__}')"

  summary:
    needs: [test-matrix, build-docker, build-pip]
    runs-on: ubuntu-latest

    steps:
      - name: RC Build Summary
        run: |
          echo "🎉 RC Build Complete!"
          echo ""
          echo "All checks passed:"
          echo "  ✓ Python 3.10 tests"
          echo "  ✓ Python 3.11 tests"
          echo "  ✓ Python 3.12 tests"
          echo "  ✓ Docker build"
          echo "  ✓ PyPI package build"
          echo ""
          echo "Ready to merge to main for release!"
