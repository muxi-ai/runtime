name: RC - Build & Test

on:
  push:
    branches: [rc]

jobs:
  test-matrix:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: |
          pytest tests/unit -v --tb=short

      - name: Run integration tests
        run: |
          if [ -n "$(find tests/integration -name 'test_*.py' 2>/dev/null)" ]; then
            pytest tests/integration -v --tb=short
          else
            echo "No integration tests found, skipping"
          fi
        continue-on-error: true

  security-scorecard:
    runs-on: ubuntu-latest
    # No dependency - runs in parallel with tests

    permissions:
      security-events: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: false

      - name: Upload Scorecard results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: scorecard-results.sarif

  build-docker:
    runs-on: ubuntu-latest
    # No dependency on test-matrix - runs in parallel

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: muxi-runtime:test
          # No cache to save disk space
          no-cache: true

      - name: Test Docker image
        run: |
          docker run --rm --entrypoint python muxi-runtime:test -c "from muxi.runtime import __version__; print(f'MUXI Runtime v{__version__}')"

  build-pip:
    runs-on: ubuntu-latest
    needs: test-matrix

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Verify package
        run: |
          pip install --no-deps dist/*.whl
          pip show muxi-runtime
          # Verify wheel contains expected files
          unzip -l dist/*.whl | grep -E "(muxi/runtime/__init__|\.version)"

  summary:
    needs: [test-matrix, build-docker, build-pip, security-scorecard]
    runs-on: ubuntu-latest

    steps:
      - name: RC Build Summary
        run: |
          echo "RC Build Complete!"
          echo ""
          echo "All checks passed:"
          echo "  - Python 3.10 tests"
          echo "  - Python 3.11 tests"
          echo "  - Python 3.12 tests"
          echo "  - Docker build"
          echo "  - PyPI package build"
          echo "  - Security scorecard"
          echo ""
          echo "Ready to merge to main for release!"
