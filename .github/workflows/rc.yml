name: RC - Build & Test

on:
  push:
    branches: [rc]

permissions:
  contents: read

jobs:
  test-matrix:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          df -h

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: |
          pytest tests/unit -v --tb=short

      - name: Run integration tests
        run: |
          if [ -n "$(find tests/integration -name 'test_*.py' 2>/dev/null)" ]; then
            pytest tests/integration -v --tb=short
          else
            echo "No integration tests found, skipping"
          fi
        continue-on-error: true

  build-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: muxi-runtime:test
          no-cache: true

      - name: Test Docker image
        run: |
          docker run --rm --entrypoint python muxi-runtime:test -c "from muxi.runtime import __version__; print(f'MUXI Runtime v{__version__}')"

  build-pip:
    runs-on: ubuntu-latest
    needs: test-matrix
    permissions:
      contents: read

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Verify package
        run: |
          pip install --no-deps dist/*.whl
          pip show muxi-runtime
          unzip -l dist/*.whl | grep -E "(muxi/runtime/__init__|\.version)"

  summary:
    needs: [test-matrix, build-docker, build-pip]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: RC Build Summary
        run: |
          echo "RC Build Complete!"
          echo ""
          echo "All checks passed:"
          echo "  - Python 3.10 tests"
          echo "  - Python 3.11 tests"
          echo "  - Python 3.12 tests"
          echo "  - Docker build"
          echo "  - PyPI package build"
          echo ""
          echo "Ready to merge to main for release!"
