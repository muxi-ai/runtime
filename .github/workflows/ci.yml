name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          df -h

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black

      - name: Run ruff (includes import sorting)
        run: ruff check src/

      - name: Check formatting (black)
        run: black --check --line-length 100 src/

  test:
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read

    env:
      # Download HF models via the authenticated Xet client. The hf_xet
      # client + HF_TOKEN handles the CAS bridge correctly and fast;
      # disabling Xet (or removing hf_xet) forces a plain-HTTP GET of the
      # Xet presigned URL, which 403s. Cache models under HF_HOME so the
      # download happens once and is reused across runs.
      HF_HOME: ${{ github.workspace }}/.hf-cache
      HF_TOKEN: ${{ secrets.MUXI_HF_TOKEN }}

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          df -h

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Cache HuggingFace models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.HF_HOME }}
          key: hf-models-${{ runner.os }}-e5small-nomic-v3

      - name: Prewarm classifier model
        run: python scripts/prewarm_classifier.py

      - name: Run unit tests
        run: |
          pytest tests/unit -v --tb=short -x

      - name: Run integration tests
        run: |
          if [ -n "$(find tests/integration -name 'test_*.py' 2>/dev/null)" ]; then
            pytest tests/integration -v --tb=short -x
          else
            echo "No integration tests found, skipping"
          fi
        continue-on-error: true  # Integration tests may need external services
