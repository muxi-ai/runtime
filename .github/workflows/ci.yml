name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          df -h

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black

      - name: Run ruff (includes import sorting)
        run: ruff check src/

      - name: Check formatting (black)
        run: black --check --line-length 100 src/

  test:
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read

    env:
      # Avoid the XET transfer path that has hung unauthenticated HF Hub
      # downloads in CI; fall back to the plain, timeout-respecting HTTP
      # download and bound each request.
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DOWNLOAD_TIMEOUT: '30'
      HF_HOME: ${{ github.workspace }}/.hf-cache
      # Authenticated downloads avoid HF's unauthenticated 403s so the
      # model-backed tests run instead of skipping. Optional: if the
      # secret is unset the tests skip gracefully (see conftest.py).
      HF_TOKEN: ${{ secrets.MUXI_HF_TOKEN }}

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          df -h

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # Remove the Xet transfer client so huggingface_hub falls back
          # to the plain HTTPS download path. The Xet CAS bridge has
          # 403'd/hung unauthenticated public-model downloads in CI, and
          # HF_HUB_DISABLE_XET alone did not divert off it.
          pip uninstall -y hf_xet || true

      - name: Cache HuggingFace models
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ${{ env.HF_HOME }}
          key: hf-models-${{ runner.os }}-e5small-nomic-v2

      - name: Prewarm classifier model
        run: python scripts/prewarm_classifier.py

      - name: Run unit tests
        run: |
          pytest tests/unit -v --tb=short -x

      - name: Run integration tests
        run: |
          if [ -n "$(find tests/integration -name 'test_*.py' 2>/dev/null)" ]; then
            pytest tests/integration -v --tb=short -x
          else
            echo "No integration tests found, skipping"
          fi
        continue-on-error: true  # Integration tests may need external services
