name: Embeddings CI Diagnostic

# Manually-triggered workflow for diagnosing the integration-test hang
# on the feature/embeddings branch. Lets us iterate on test config
# without polluting the main CI workflow that runs on every PR.
#
# Trigger: GitHub UI → Actions → "Embeddings CI Diagnostic" → "Run workflow"
# Inputs let us toggle which test tier to run.

on:
  workflow_dispatch:
    inputs:
      run_unit:
        description: 'Run unit tests'
        required: true
        default: true
        type: boolean
      run_integration:
        description: 'Run integration tests (suspected CI hang source)'
        required: true
        default: false
        type: boolean
      integration_wall_timeout:
        description: 'Wall-clock timeout (seconds) for the integration test step'
        required: true
        default: '600'
        type: string

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          df -h

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Show diagnostic context
        run: |
          echo "=== Branch / commit ==="
          git rev-parse --abbrev-ref HEAD
          git log -1 --oneline
          echo
          echo "=== Inputs ==="
          echo "run_unit:                 ${{ inputs.run_unit }}"
          echo "run_integration:          ${{ inputs.run_integration }}"
          echo "integration_wall_timeout: ${{ inputs.integration_wall_timeout }}"
          echo
          echo "=== Test inventory ==="
          echo "unit test files:        $(find tests/unit -name 'test_*.py' 2>/dev/null | wc -l)"
          echo "integration test files: $(find tests/integration -name 'test_*.py' 2>/dev/null | wc -l)"
          echo
          echo "=== HF cache state (cold by default in CI) ==="
          ls -la "${HOME}/.cache/huggingface" 2>/dev/null || echo "no HF cache present"

      - name: Run unit tests
        if: ${{ inputs.run_unit }}
        run: |
          pytest tests/unit -v --tb=short -x

      - name: Run integration tests (with hard wall-clock guard)
        if: ${{ inputs.run_integration }}
        # The shell `timeout` is the ONLY mechanism that can interrupt a
        # test stuck inside a C-level urllib3/openssl recv() — pytest-timeout
        # (thread method) cannot deliver an exception into a thread that has
        # released the GIL and is parked in the kernel. SIGKILL guarantees
        # the process tree dies regardless of where it's stuck.
        run: |
          if [ -n "$(find tests/integration -name 'test_*.py' 2>/dev/null)" ]; then
            timeout --signal=KILL "${{ inputs.integration_wall_timeout }}" \
              pytest tests/integration -v --tb=short -x \
              || echo "::warning::Integration tests exited non-zero (timeout or failure) — see log above"
          else
            echo "No integration tests found, skipping"
          fi
        continue-on-error: true
