# Formation Configuration Schema
schema: "1.0.0"                    # REQUIRED: Schema version (Semantic Versioning)
id: "formation1"                   # REQUIRED: Unique identifier for this formation
name: "Formation A - Research"     # REQUIRED: Human-readable name
description: "Test Formation 1 for A2A Communication"  # REQUIRED: Human-readable description

# LLM Configuration
llm:
  # Global model settings
  settings:
    temperature: 0.7               # Default temperature (0.0-1.0)
    max_tokens: 1000              # Default max tokens for responses
    timeout_seconds: 30           # Default request timeout

  # API Key Configuration
  api_keys:
    openai: "${{ secrets.OPENAI_API_KEY }}"  # Environment variable substitution

  # Model definitions by capability
  models:
    - text: "openai/gpt-4o"       # Text generation and conversation
    - vision: "openai/gpt-4o"     # Image analysis and vision tasks
    - audio: "openai/whisper-1"   # Audio transcription and processing
    - documents: "openai/gpt-4o"  # Document processing and extraction
    - embedding: "openai/text-embedding-3-large"  # Text embeddings

# A2A Configuration
a2a:
  enabled: true                   # Enable Agent-to-Agent communication

  outbound:
    enabled: true                 # Enable outbound A2A communication
    registries:                   # External A2A registries to connect to
      - "http://0.0.0.0:9090"
    default_retry_attempts: 3     # Default number of retry attempts
    default_timeout_seconds: 30   # Default timeout for A2A requests

    # Outbound services with secrets-based authentication
    services:
      - service_id: "external-billing-service"
        auth:
          type: "api_key"
          header: "X-API-Key"
          api_key: "${{ secrets.BILLING_API_KEY }}"
      - service_id: "analytics-engine"
        auth:
          type: "bearer"
          token: "${{ secrets.ANALYTICS_TOKEN }}"
      - service_id: "secure-messaging"
        auth:
          type: "basic"
          username: "${{ secrets.SECURE_MESSAGING_USER }}"
          password: "${{ secrets.SECURE_MESSAGING_PASS }}"

  inbound:
    enabled: true                 # Enable inbound A2A communication
    registries:                   # External A2A registries for server registration
      - "http://0.0.0.0:9090"
    port: 8181                    # Port for A2A server to listen on
    trusted_endpoints: []         # List of trusted external endpoints
    mode: "apiKey"                # Authentication mode for inbound requests
    shared_key: "${{ secrets.A2A_SHARED_KEY }}"  # Inbound authentication key

# Agent configuration
# Agents found in agents/ will be automatically added to the list
agents:
  - id: "research-agent"
    name: "Research Agent"
    description: "Specialized agent for conducting research and gathering information"
    system_message: "You are a research agent specialized in gathering and analyzing information. You work collaboratively with other agents to provide comprehensive research support."
