schema: "1.0.0"
id: "basic-test-formation"
description: "Single agent formation with minimal memory for basic testing"

llm:
  settings:
    temperature: 0.7
    max_tokens: 2000
  api_keys:
    openai: "${{ secrets.OPENAI_API_KEY }}"
  models:
    - text: "openai/gpt-5-nano"

memory:
  buffer:
    size: 10
    multiplier: 5
    vector_search: false

logging:
  streams:
    - transport: "stdout"
      level: "info"
      format: "jsonl"

runtime:
  built_in_mcps: false  # Disable built-in MCPs for faster test startup

# Agent will be auto-discovered from agents/ directory
