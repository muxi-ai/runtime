# Test Formation for A2A Operations
schema: "1.0.0"
id: "basic-a2a-test-formation"
description: "Basic formation for testing A2A operations"

# LLM Configuration
llm:
  settings:
    temperature: 0.7
    max_tokens: 1000
    timeout_seconds: 30
  api_keys:
    openai: "${{ secrets.OPENAI_API_KEY }}"
  models:
    - text: "openai/gpt-4o-mini"
    - embedding: "openai/text-embedding-3-large"

# A2A Configuration for testing
a2a:
  enabled: true
  outbound:
    enabled: true
    registries:
      - "http://localhost:9090"
  inbound:
    enabled: true
    registries:
      - "http://localhost:9090"
    port: 8181

# Components will be auto-discovered from subdirectories
agents: []
mcp:
  servers: []
