schema: "1.0.0"
id: "formation-b"
description: "Formation B - Writing Specialists"
version: "1.0.0"

# LLM Configuration
llm:
  # Global model settings
  settings:
    temperature: 0.7
    max_tokens: 1000
    timeout_seconds: 30

  # API Key Configuration
  api_keys:
    openai: "${{ secrets.OPENAI_API_KEY }}"

  # Model definitions by capability
  models:
    - text: "openai/gpt-4o-mini"

# Agent definitions
agents:
  - schema: "1.0.0"
    id: "writer-agent"
    name: "Content Writer Agent"
    description: "Specialized in content creation, writing, and documentation with collaboration capabilities"
    system_message: "You are a professional writing specialist agent that excels at creating high-quality content, articles, reports, and documentation. You can work with research provided by other agents to create comprehensive written materials."
    a2a:
      internal: true
      external: true

# A2A Configuration
a2a:
  # External Registries for cross-formation communication
  registries:
    - "http://localhost:9090"

  # Server Configuration
  server:
    enabled: true
    port: 8081
    host: "127.0.0.1"
    trusted_endpoints:
      - "localhost"
      - "127.0.0.1"
    mode: "none"  # No authentication for testing

# Memory Configuration
memory:
  buffer_size: 20
  long_term: "sqlite:///formation_b.db"

