---
schema: "1.0.0"
id: assistant
name: Assistant
description: A helpful assistant with Postgres-based long-term memory
llm_models:
  - text: "openai/gpt-4o"
    api_key: ${OPENAI_API_KEY}
    settings:
      temperature: 0.2
memory:
  buffer: 15
  long_term: ${POSTGRES_DATABASE_URL}
# Note: Ensure POSTGRES_DATABASE_URL includes the postgresql:// prefix
